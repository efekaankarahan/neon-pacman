            if (B.burnout === 0) { B.beat = Math.max(0, B.beat - (m.type === 'special' ? 6 : 3)); }
            A.addSuper((m.dmg || 40) * 0.12); B.addSuper((m.dmg || 40) * 0.16);
            this.hitstop = 4 + (m.sfx || 1);
            Snd.block();
            FX.spark(hx, hy, 8, '#8ad7ff', 5, 18);
            FX.ring(hx, hy, '#8ad7ff', 60, 3);
            Cam.kick(3);
            A.didConnect = true;
            if (B.hp <= 0) this.doKO();
            return 'block';
        }

        /* ---- clean hit ---- */
        let counter = '';
        let mult = 1;
        if (B.state === 'attack' && B.move) {
            if (B.mf < B.move.startup) { counter = 'COUNTER'; mult = 1.2; }
            else if (B.mf >= B.move.startup + B.move.active) { counter = 'PUNISH'; mult = 1.35; }
        }
        const scale = m.noScale ? 1 : SCALE[Math.min(A.comboHits, SCALE.length - 1)];
        const dmg = Math.max(4, Math.round((m.dmg || 40) * scale * mult * (A.dmgMul || 1) * (B.defMul || 1)));
        B.takeRaw(dmg, A);
        B.stun += (m.stun || 30) * (counter ? 1.3 : 1);
        B.move = null; B.armor = 0;
        B.state = 'hitstun';
        B.hitstunT = (m.hitstun || 16) + (counter ? 5 : 0);
        B.blocking = false;
        B.didConnect = false;

        /* On a multi-hit move only the last hit sends the opponent flying -
           the earlier ones barely nudge them, so the rest of the sequence
           can actually connect. */
        const totalHits = m.hits || 1;
        const finalHit = (A.hitCount + 1) >= totalHits;
        const pushAmt = (m.push || 4) * (finalHit ? 1 : 0.28);
        const launched = (finalHit && (m.launch || 0) < 0) || B.air;
        if (launched) {
            B.air = true;
            B.juggle++;
            const lv = m.launch ? m.launch : -7;
            B.vy = Math.min(B.vy, lv * (B.juggle > 3 ? 0.55 : 1));
            B.vx = pushAmt * 0.75 * A.facing;
            B.setAnim(m.launch ? 'launch' : 'hitAir');
            if (finalHit) B.knockdownPending = true;
        } else {
            B.vx = pushAmt * A.facing;
            B.setAnim(B.crouching ? 'hitCr' : ((m.hitY || -120) < -134 ? 'hitH' : 'hitL'));
            if (m.knockdown && finalHit) B.knockdownPending = true;
            if (B.x <= 60 || B.x >= STAGE_W - 60) A.vx = -pushAmt * 0.45 * A.facing;
        }
        if (m.type === 'impact') {
            B.hitstunT = 46; B.knockdownPending = true;
            FX.text(B.x, B.y - 210, 'CRUMPLE', '#ffb300', 18, 60);
            Cam.bang(0.5, '#ffb300'); Cam.kick(20);
        }

        A.didConnect = true;
        A.comboHits++; A.comboT = 100; A.comboDmg += dmg;
        A.addSuper(dmg * (m.type === 'super' ? 0 : 0.5));
        B.addSuper(dmg * 0.3);

        const power = m.sfx === undefined ? 1 : m.sfx;
        const rapid = (m.hits || 1) > 3;   /* machine-gun moves must not stall the match */
        this.hitstop = rapid ? 3 : (6 + power * 4 + (counter ? 4 : 0) + (m.type === 'super' ? 4 : 0));
        Cam.kick(6 + power * 4);
        if (power >= 2 || m.type === 'super') Cam.bang(0.22, '#fff');
        Snd.hit(power);
        FX.spark(hx, hy, 10 + power * 6, power >= 2 ? '#fff' : '#ffe9a8', 6 + power * 2);
        FX.ring(hx, hy, power >= 2 ? '#fff' : '#ffd166', 60 + power * 30, 4);
        if (counter) FX.text(B.x, B.y - 215, counter, '#ff4d6d', 16, 44);
        if (A.comboHits === 1) FX.text(hx, hy - 40, '' + dmg, '#fff', 16, 34);

        if (B.hp <= 0) this.doKO();
        return 'hit';
    }
};

/* =====================================================================
   DRAWING THE FIGHTERS
   ===================================================================== */
function poseWorld(f, pose) {
    const b = f.style.build, fx = f.facing;
    const out = {};
    const rot = pose.rot || 0;
    const px = pose.pel[0], py = pose.pel[1];
    const cos = Math.cos(rot), sin = Math.sin(rot);
    for (const k of POSE_KEYS) {
        let lx = pose[k][0], ly = pose[k][1];
        if (rot) {
            const dx = lx - px, dy = ly - py;
            lx = px + dx * cos - dy * sin;
            ly = py + dx * sin + dy * cos;
        }
        out[k] = { x: f.x + lx * b * fx, y: f.y + ly * b };
    }
    /* derived joints */
    const off = (a, dx, dy) => ({ x: a.x + dx * b * fx, y: a.y + dy * b });
    out.s1 = off(out.ch, 13, -7); out.s2 = off(out.ch, -12, -7);
    out.g1 = off(out.pel, 11, 0); out.g2 = off(out.pel, -11, 0);
    return out;
}

function lerp2(a, b, t) { return { x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t) }; }

function limb(a, b, c, w, col, outline) {
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (outline) {
        ctx.strokeStyle = outline; ctx.lineWidth = w + 4;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.stroke();
    }
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.stroke();
}

function drawFighter(f, alpha, tint) {
    const S = f.style, b = S.build;
    const P = poseWorld(f, f.pose);
    const dark = 'rgba(0,0,0,0.55)';
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;

    /* ground shadow */
    if (alpha === undefined || alpha > 0.9) {
        const h = clamp(1 - (GROUND_Y - f.y) / 300, 0.25, 1);
        ctx.fillStyle = 'rgba(0,0,0,' + (0.38 * h) + ')';
        ctx.beginPath();
        ctx.ellipse(f.x, GROUND_Y + 4, 46 * b * h, 12 * h, 0, 0, 7);
        ctx.fill();
    }

    const glowOn = f.exGlow > 0 || f.superFreeze > 0 || (f.move && f.move.type === 'super');
    if (glowOn) { ctx.shadowBlur = 26; ctx.shadowColor = S.aura; }
    else if (f.burnout > 0) { ctx.shadowBlur = 16; ctx.shadowColor = '#ff5252'; }

    const skin = tint || S.skin;
    const gi = tint || S.gi;
    const giD = tint || S.giDark;
    const trim = tint || S.trim;

    /* back limbs */
    limb(P.s2, P.e2, P.h2, 12.5 * b, giD, dark);
    limb(P.g2, P.k2, P.f2, 16 * b, giD, dark);
    ctx.fillStyle = tint || '#1a1a22';
    ctx.beginPath(); ctx.arc(P.f2.x, P.f2.y - 2, 8 * b, 0, 7); ctx.fill();

    /* neck */
    limb(P.ch, lerp2(P.ch, P.hd, 0.5), P.hd, 12 * b, skin, dark);

    /* torso: the polygon is stroked as well as filled so the body reads
       as a solid chunk instead of a wire quad */
    ctx.beginPath();
    ctx.moveTo(P.s1.x, P.s1.y); ctx.lineTo(P.s2.x, P.s2.y);
    ctx.lineTo(P.g2.x, P.g2.y); ctx.lineTo(P.g1.x, P.g1.y);
    ctx.closePath();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = dark; ctx.lineWidth = 20 * b; ctx.stroke();
    const tg = ctx.createLinearGradient(P.s1.x, P.s1.y, P.g2.x, P.g2.y);
    tg.addColorStop(0, gi); tg.addColorStop(1, giD);
    ctx.strokeStyle = tint ? tint : tg; ctx.lineWidth = 15 * b; ctx.stroke();
    ctx.fillStyle = tint ? tint : tg; ctx.fill();
    /* chest trim */
    ctx.strokeStyle = trim; ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(lerp(P.s1.x, P.s2.x, 0.5), lerp(P.s1.y, P.s2.y, 0.5));
    ctx.lineTo(lerp(P.g1.x, P.g2.x, 0.45), lerp(P.g1.y, P.g2.y, 0.45));
    ctx.stroke();
    /* belt */
    ctx.strokeStyle = trim; ctx.lineWidth = 7 * b;
    ctx.beginPath(); ctx.moveTo(P.g1.x, P.g1.y); ctx.lineTo(P.g2.x, P.g2.y); ctx.stroke();

    /* front leg */
    limb(P.g1, P.k1, P.f1, 17.5 * b, gi, dark);
    ctx.fillStyle = tint || '#23232c';
    ctx.beginPath(); ctx.arc(P.f1.x, P.f1.y - 2, 8.5 * b, 0, 7); ctx.fill();

    /* head */
    const hr = 15.5 * b;
    ctx.strokeStyle = dark; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(P.hd.x, P.hd.y, hr, 0, 7);
    ctx.fillStyle = skin; ctx.fill(); ctx.stroke();
    drawHair(f, P, hr, tint);
    if (!tint) {
        /* face: a brow and an eye, always toward the opponent */
        ctx.fillStyle = '#241a16';
        ctx.fillRect(P.hd.x + f.facing * hr * 0.18, P.hd.y - hr * 0.18, 5 * b * f.facing, 3.4 * b);
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(P.hd.x + f.facing * hr * 0.38, P.hd.y + hr * 0.02, 2.6 * b, 0, 7); ctx.fill();
    }

    /* front arm */
    limb(P.s1, P.e1, P.h1, 13.5 * b, gi, dark);
    ctx.fillStyle = trim;
    ctx.beginPath(); ctx.arc(P.h1.x, P.h1.y, 8 * b, 0, 7); ctx.fill();
    ctx.fillStyle = trim;
    ctx.beginPath(); ctx.arc(P.h2.x, P.h2.y, 7.4 * b, 0, 7); ctx.fill();

    ctx.restore();
}

function drawHair(f, P, hr, tint) {
    const S = f.style;
    const fx = f.facing, b = S.build;
    ctx.save();
    ctx.fillStyle = tint || S.hair;
    ctx.strokeStyle = tint || S.hair;
    const x = P.hd.x, y = P.hd.y;
    switch (S.hairStyle) {
        case 'band':
            ctx.beginPath(); ctx.arc(x, y - hr * 0.15, hr * 1.02, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();
            ctx.fillStyle = tint || S.trim;
            ctx.fillRect(x - hr, y - hr * 0.55, hr * 2, 6 * b);
            ctx.beginPath();
            ctx.moveTo(x - fx * hr, y - hr * 0.5);
            ctx.quadraticCurveTo(x - fx * hr * 2.4, y - hr * 0.2 + Math.sin(f.auraT * 0.18) * 6, x - fx * hr * 3.1, y + hr * 0.5 + Math.sin(f.auraT * 0.2) * 8);
            ctx.lineTo(x - fx * hr * 3.0, y + hr * 0.9 + Math.sin(f.auraT * 0.2) * 8);
            ctx.quadraticCurveTo(x - fx * hr * 2.2, y + hr * 0.3, x - fx * hr, y - hr * 0.1);
            ctx.fill();
            break;
        case 'tail':
            ctx.beginPath(); ctx.arc(x, y - hr * 0.2, hr * 1.05, Math.PI * 1.0, Math.PI * 2.1); ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x - fx * hr * 0.6, y - hr * 0.5);
            ctx.quadraticCurveTo(x - fx * hr * 3.2, y - hr * 1.2 + Math.sin(f.auraT * 0.15) * 10, x - fx * hr * 3.6, y + hr * 0.9);
            ctx.quadraticCurveTo(x - fx * hr * 2.2, y + hr * 0.1, x - fx * hr * 0.5, y + hr * 0.2);
            ctx.fill();
            break;
        case 'spiky':
            for (let i = -2; i <= 2; i++) {
                ctx.beginPath();
                ctx.moveTo(x + i * hr * 0.44, y - hr * 0.55);
                ctx.lineTo(x + i * hr * 0.44 - fx * hr * 0.5, y - hr * 1.85);
                ctx.lineTo(x + i * hr * 0.44 + hr * 0.32, y - hr * 0.62);
                ctx.fill();
            }
            break;
        case 'bald':
            ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.ellipse(x + fx * hr * 0.2, y - hr * 0.5, hr * 0.4, hr * 0.2, 0, 0, 7); ctx.fill();
            ctx.globalAlpha = 1;
            break;
        case 'hood':
            ctx.beginPath();
            ctx.moveTo(x - fx * hr * 1.3, y + hr * 0.8);
            ctx.quadraticCurveTo(x - fx * hr * 1.5, y - hr * 1.9, x + fx * hr * 0.5, y - hr * 1.25);
            ctx.quadraticCurveTo(x + fx * hr * 1.25, y - hr * 0.75, x + fx * hr * 1.1, y - hr * 0.1);
            ctx.quadraticCurveTo(x, y - hr * 0.6, x - fx * hr * 0.9, y + hr * 0.9);
            ctx.fill();
            break;
        case 'topknot':
            ctx.beginPath(); ctx.arc(x, y - hr * 0.25, hr * 1.02, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();
            ctx.beginPath(); ctx.arc(x - fx * hr * 0.35, y - hr * 1.35, hr * 0.45, 0, 7); ctx.fill();
            break;
        case 'crown':
            ctx.beginPath(); ctx.arc(x, y - hr * 0.2, hr * 1.03, Math.PI * 1.05, Math.PI * 2.05); ctx.fill();
            ctx.fillStyle = tint || S.trim;
            ctx.beginPath();
            ctx.moveTo(x - hr * 1.05, y - hr * 0.75);
            for (let i = 0; i < 4; i++) {
                const bx = x - hr * 1.05 + (hr * 2.1 / 4) * i;
                ctx.lineTo(bx + hr * 0.26, y - hr * 1.7);
                ctx.lineTo(bx + hr * 0.52, y - hr * 0.8);
            }
            ctx.lineTo(x + hr * 1.05, y - hr * 0.72);
            ctx.closePath(); ctx.fill();
            break;
    }
    ctx.restore();
}

function drawFighterFull(f) {
    for (const t of f.trail) {
        if (t.a < 0.05) continue;
        const saveX = f.x, saveY = f.y, saveF = f.facing, saveP = f.pose;
        f.x = t.x; f.y = t.y; f.facing = t.f; f.pose = t.pose;
        drawFighter(f, t.a * 0.5, f.style.aura);
        f.x = saveX; f.y = saveY; f.facing = saveF; f.pose = saveP;
    }
    if (f.hitFlash > 0) {
        drawFighter(f, 1);
        ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = f.hitFlash / 8;
        drawFighter(f, 1, '#ffffff'); ctx.restore();
    } else {
        drawFighter(f, 1);
    }
    /* status auras */
    if (f.burnout > 0 && f.auraT % 6 < 3) {
        ctx.save(); ctx.globalAlpha = 0.35; ctx.globalCompositeOperation = 'lighter';
        drawFighter(f, 0.5, '#ff5252'); ctx.restore();
    }
    if (f.state === 'dizzy') {
        const P = poseWorld(f, f.pose);
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 4; i++) {
            const a = f.auraT * 0.09 + i * Math.PI / 2;
            ctx.fillStyle = '#ffd400';
            ctx.beginPath();
            ctx.arc(P.hd.x + Math.cos(a) * 34, P.hd.y - 36 + Math.sin(a) * 12, 5, 0, 7);
            ctx.fill();
        }
        ctx.restore();
    }
}

/* =====================================================================
   STAGES
   ===================================================================== */
let seed = 1337;
function srnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }

const Stage = {
    data: {},
    build() {
        seed = 99;
        const buildings = [];
        for (let i = 0; i < 34; i++) {
            buildings.push({
                x: -300 + i * 90 + srnd() * 30, w: 60 + srnd() * 60,
                h: 120 + srnd() * 320, hue: srnd(),
                lights: Math.floor(srnd() * 24)
            });
        }
        const crowd = [];
        for (let i = 0; i < 60; i++) crowd.push({ x: -200 + i * 46 + srnd() * 20, s: 0.8 + srnd() * 0.5, p: srnd() * 6 });
        const stars = [];
        for (let i = 0; i < 90; i++) stars.push({ x: srnd() * 2400, y: srnd() * 300, r: srnd() * 1.6 + 0.4 });
        this.data = { buildings, crowd, stars };
    },
    draw(name, t) {
        const d = this.data;
        switch (name) {
            case 'city': this.city(d, t); break;
            case 'dojo': this.dojo(d, t); break;
            case 'subway': this.subway(d, t); break;
            case 'roof': this.roof(d, t); break;
            default: this.city(d, t);
        }
        this.floor(name, t);
    },
    sky(c1, c2) {
        const g = ctx.createLinearGradient(0, -400, 0, GROUND_Y);
        g.addColorStop(0, c1); g.addColorStop(1, c2);
        ctx.fillStyle = g;
        ctx.fillRect(-600, -600, STAGE_W + 1200, GROUND_Y + 620);
    },
    city(d, t) {
        this.sky('#120a2a', '#3b1450');
        ctx.save();
        for (const s of d.stars) {
            ctx.globalAlpha = 0.35 + Math.sin(t * 0.03 + s.x) * 0.25;
            ctx.fillStyle = '#fff';
            ctx.fillRect(s.x * 0.9 - 200, -420 + s.y, s.r * 2, s.r * 2);
        }
        ctx.globalAlpha = 1;
        /* far skyline */
        for (let layer = 0; layer < 2; layer++) {
            const par = layer === 0 ? 0.55 : 0.78;
            const shift = (Cam.x - STAGE_W / 2) * (1 - par);
            ctx.fillStyle = layer === 0 ? '#1b1038' : '#241247';
            for (const b of d.buildings) {
                if ((b.x | 0) % 2 !== layer) continue;
                const bx = b.x * par + shift, bh = b.h * (layer === 0 ? 0.8 : 1);
                ctx.fillRect(bx, GROUND_Y - bh - 60, b.w, bh + 60);
                ctx.fillStyle = layer === 0 ? 'rgba(255,120,220,0.5)' : 'rgba(120,240,255,0.55)';
                for (let i = 0; i < b.lights; i++) {
                    const lx = bx + 8 + (i % 4) * (b.w / 4.5);
                    const ly = GROUND_Y - bh + 14 + Math.floor(i / 4) * 26;
                    if (((i * 7 + (b.x | 0)) % 5) !== 0) ctx.fillRect(lx, ly, 6, 9);
                }
                ctx.fillStyle = layer === 0 ? '#1b1038' : '#241247';
            }
        }
        /* neon signs */
        const signs = [['BEAT', '#ff2e63', 320], ['NEON', '#00f3ff', 900], ['1', '#ffd400', 1500]];
        for (const s of signs) {
            const sx = s[2] * 0.85 + (Cam.x - STAGE_W / 2) * 0.15;
            ctx.save();
            ctx.globalAlpha = 0.75 + Math.sin(t * 0.08 + s[2]) * 0.2;
            ctx.shadowBlur = 30; ctx.shadowColor = s[1];
            ctx.fillStyle = s[1];
            ctx.font = 'bold 46px "Press Start 2P", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(s[0], sx, GROUND_Y - 300);
            ctx.restore();
        }
        ctx.restore();
        /* rain */
        ctx.save(); ctx.strokeStyle = 'rgba(160,220,255,0.25)'; ctx.lineWidth = 2;
        for (let i = 0; i < 70; i++) {
            const rx = ((i * 137 + t * 9) % (STAGE_W + 400)) - 200;
            const ry = ((i * 71 + t * 26) % 700) - 100;
            ctx.beginPath(); ctx.moveTo(rx, ry); ctx.lineTo(rx - 5, ry + 22); ctx.stroke();
        }
        ctx.restore();
        this.crowd(d, t, 'rgba(10,4,20,0.9)');
    },
    dojo(d, t) {
        this.sky('#2a1b12', '#5b3320');
        ctx.save();
        /* wooden wall */
        ctx.fillStyle = '#3d2517';
        ctx.fillRect(-600, GROUND_Y - 460, STAGE_W + 1200, 460);
        ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 4;
        for (let x = -600; x < STAGE_W + 600; x += 120) {
            ctx.beginPath(); ctx.moveTo(x, GROUND_Y - 460); ctx.lineTo(x, GROUND_Y); ctx.stroke();
        }
        /* big banner */
        ctx.fillStyle = '#8c1c1c';
        ctx.fillRect(STAGE_W / 2 - 160, GROUND_Y - 430, 320, 300);
        ctx.fillStyle = '#f2e9c9';
        ctx.font = 'bold 44px "Press Start 2P", monospace'; ctx.textAlign = 'center';
        ctx.fillText('BEAT', STAGE_W / 2, GROUND_Y - 330);
        ctx.fillText('DOJO', STAGE_W / 2, GROUND_Y - 250);
        /* lanterns */
        for (let i = 0; i < 8; i++) {
            const lx = 120 + i * 240, sway = Math.sin(t * 0.03 + i) * 8;
            ctx.strokeStyle = '#2a1a10'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(lx, GROUND_Y - 460); ctx.lineTo(lx + sway, GROUND_Y - 380); ctx.stroke();
            ctx.save();
            ctx.shadowBlur = 26; ctx.shadowColor = '#ff9d3d';
            ctx.fillStyle = '#ff9d3d';
            ctx.beginPath(); ctx.ellipse(lx + sway, GROUND_Y - 352, 22, 30, 0, 0, 7); ctx.fill();
            ctx.restore();
        }
        ctx.restore();
        this.crowd(d, t, 'rgba(20,10,4,0.85)');
    },
    subway(d, t) {
        this.sky('#0b1420', '#16303f');
        ctx.save();
        ctx.fillStyle = '#0e1c26';
        ctx.fillRect(-600, GROUND_Y - 520, STAGE_W + 1200, 520);
        /* tunnel */
        ctx.fillStyle = '#050b10';
        ctx.fillRect(-600, GROUND_Y - 430, STAGE_W + 1200, 250);
        /* passing train */
        const trainX = ((t * 7) % (STAGE_W + 2600)) - 1300;
        ctx.fillStyle = '#274b5c';
        ctx.fillRect(trainX, GROUND_Y - 410, 1100, 210);
        ctx.fillStyle = '#9be7ff';
        for (let i = 0; i < 10; i++) ctx.fillRect(trainX + 40 + i * 106, GROUND_Y - 370, 70, 60);
        ctx.fillStyle = '#0e1c26';
        /* pillars */
        for (let x = 60; x < STAGE_W; x += 300) {
            ctx.fillStyle = '#1d3a49';
            ctx.fillRect(x, GROUND_Y - 300, 46, 300);
            ctx.fillStyle = '#2a5468'; ctx.fillRect(x, GROUND_Y - 300, 14, 300);
            ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = '#7cf7ff';
            ctx.fillStyle = '#7cf7ff'; ctx.fillRect(x + 4, GROUND_Y - 320, 38, 8);
            ctx.restore();
        }
        ctx.restore();
        this.crowd(d, t, 'rgba(4,12,18,0.9)');
    },
    roof(d, t) {
        const g = ctx.createLinearGradient(0, -400, 0, GROUND_Y);
        g.addColorStop(0, '#1a1147'); g.addColorStop(0.5, '#a2385f'); g.addColorStop(1, '#ffb457');
        ctx.fillStyle = g; ctx.fillRect(-600, -600, STAGE_W + 1200, GROUND_Y + 620);
        ctx.save();
        /* sun */
        ctx.globalAlpha = 0.85; ctx.fillStyle = '#ffe08a';
        ctx.beginPath(); ctx.arc(STAGE_W / 2 + (Cam.x - STAGE_W / 2) * 0.1, GROUND_Y - 250, 130, 0, 7); ctx.fill();
        ctx.globalAlpha = 1;
        /* distant towers */
        const shift = (Cam.x - STAGE_W / 2) * 0.35;
        for (const b of d.buildings) {
            const bx = b.x * 0.7 + shift;
            ctx.fillStyle = 'rgba(40,20,60,0.75)';
            ctx.fillRect(bx, GROUND_Y - b.h * 0.7 - 40, b.w * 0.9, b.h * 0.7 + 40);
        }
        /* clouds */
        for (let i = 0; i < 6; i++) {
            const cx = ((i * 420 + t * 0.35) % (STAGE_W + 800)) - 400;
            ctx.fillStyle = 'rgba(255,220,240,0.28)';
            ctx.beginPath();
            ctx.ellipse(cx, GROUND_Y - 420 - i * 22, 150, 26, 0, 0, 7); ctx.fill();
        }
        ctx.restore();
        this.crowd(d, t, 'rgba(30,10,40,0.8)');
    },
    crowd(d, t, col) {
        ctx.save();
        ctx.fillStyle = col;
        const shift = (Cam.x - STAGE_W / 2) * 0.08;
        /* a distant crowd: small, low contrast, cut off by the stage floor */
        const base = GROUND_Y - 26;
        for (const c of d.crowd) {
            const x = c.x - shift;
            const bob = Math.sin(t * 0.09 + c.p) * 3;
            const s = c.s * 0.62;
            const h = 54 * s;
            ctx.beginPath();
            ctx.arc(x, base - h + bob, 9 * s, 0, 7); ctx.fill();
            ctx.fillRect(x - 11 * s, base - h + 8 * s + bob, 22 * s, h);
        }
        ctx.restore();
    },
    floor(name, t) {
        const cols = {
            city: ['#1a0f2e', '#2b1a4a', '#ff2e63'],
            dojo: ['#2a1a10', '#4a2f1c', '#ffb454'],
            subway: ['#0b161d', '#16303f', '#7cf7ff'],
            roof: ['#2a1830', '#4a2a44', '#ffd166']
        }[name] || ['#1a0f2e', '#2b1a4a', '#ff2e63'];
        const g = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 200);
        g.addColorStop(0, cols[1]); g.addColorStop(1, cols[0]);
        ctx.fillStyle = g;
        ctx.fillRect(-600, GROUND_Y, STAGE_W + 1200, 300);
        ctx.strokeStyle = cols[2]; ctx.globalAlpha = 0.8; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-600, GROUND_Y); ctx.lineTo(STAGE_W + 600, GROUND_Y); ctx.stroke();
        ctx.globalAlpha = 0.16;
        for (let i = 0; i <= 26; i++) {
            const x = -600 + i * ((STAGE_W + 1200) / 26);
            ctx.beginPath(); ctx.moveTo(x, GROUND_Y);
            ctx.lineTo(lerp(x, STAGE_W / 2, -1.4), GROUND_Y + 220); ctx.stroke();
        }
        ctx.globalAlpha = 1;
        /* stage edges - World Tour streets are wider than a fight stage */
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-600, GROUND_Y - 700, 620, 1000);
        ctx.fillRect((this.right || STAGE_W) - 20, GROUND_Y - 700, 620, 1000);
    }
};
Stage.build();

/* =====================================================================
   HUD
   ===================================================================== */
function px(n) { return 'bold ' + n + 'px "Press Start 2P", monospace'; }
function shadowText(str, x, y, size, col, align, blur) {
    ctx.save();
    ctx.font = px(size); ctx.textAlign = align || 'center'; ctx.textBaseline = 'alphabetic';
    if (blur) { ctx.shadowBlur = blur; ctx.shadowColor = col; }
    ctx.lineWidth = Math.max(4, size * 0.22); ctx.strokeStyle = 'rgba(0,0,0,.8)';
    ctx.strokeText(str, x, y);
    ctx.fillStyle = col; ctx.fillText(str, x, y);
    ctx.restore();
}

const HUD = {
    draw(m) {
        const a = m.f1, b = m.f2;
        if (a.hpLag === undefined) { a.hpLag = a.hp; b.hpLag = b.hp; }
        a.hpLag = approach(a.hpLag, a.hp, Math.max(1.6, (a.hpLag - a.hp) * 0.06));
        b.hpLag = approach(b.hpLag, b.hp, Math.max(1.6, (b.hpLag - b.hp) * 0.06));

        this.bar(a, 30, 34, false);
        this.bar(b, W - 30, 34, true);

        /* timer */
        const secs = Math.max(0, Math.ceil(m.timer / 60));
        ctx.save();
        ctx.fillStyle = 'rgba(8,4,18,.85)';
        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.rect(W / 2 - 62, 22, 124, 74); ctx.fill(); ctx.stroke();
        ctx.restore();
        shadowText(m.mode === 'training' ? '--' : ('' + secs).padStart(2, '0'),
            W / 2, 78, 38, secs <= 10 && m.mode !== 'training' ? '#ff4d6d' : '#fff', 'center', 12);

        /* round pips */
        for (let i = 0; i < 2; i++) {
            this.pip(W / 2 - 82 - i * 26, 108, a.wins > i, '#ff2e63');
            this.pip(W / 2 + 82 + i * 26, 108, b.wins > i, '#00f3ff');
        }

        /* gauges */
        this.gauges(a, 30, H - 96, false);
        this.gauges(b, W - 30, H - 96, true);

        /* combo counters */
        if (a.comboHits > 1 && a.comboT > 0) this.combo(a, 190, 190, false);
        if (b.comboHits > 1 && b.comboT > 0) this.combo(b, W - 190, 190, true);

        /* banner */
        if (m.banner && m.bannerT < 130) {
            const t = m.bannerT;
            const scale = t < 12 ? 0.4 + t / 12 * 0.75 : (t > 110 ? 1 + (t - 110) * 0.03 : 1.05);
            const alpha = t > 110 ? clamp(1 - (t - 110) / 20, 0, 1) : 1;
            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.translate(W / 2, 300);
            ctx.scale(scale, scale);
            shadowText(m.banner, 0, 0, m.banner.length > 10 ? 34 : 52, '#fff', 'center', 24);
            ctx.restore();
        }

        /* super art name flash */
        [a, b].forEach(f => {
            if (f.superFreeze > 0) {
                const t = 60 - f.superFreeze;
                ctx.save();
                ctx.globalAlpha = clamp(t / 8, 0, 1) * clamp(f.superFreeze / 12, 0, 1);
                ctx.fillStyle = 'rgba(0,0,0,.55)';
                ctx.fillRect(0, 250, W, 120);
                shadowText(f.ch.super.name, W / 2, 330, 40, f.ch.super.col, 'center', 30);
                ctx.restore();
            }
        });

        if (m.mode === 'training') this.training(m);
    },
    bar(f, x, y, right) {
        const w = 470, h = 30;
        const dir = right ? -1 : 1;
        const left = right ? x - w : x;
        ctx.save();
        /* frame */
        ctx.fillStyle = 'rgba(6,3,14,.85)';
        ctx.fillRect(left - 4, y - 4, w + 8, h + 8);
        ctx.strokeStyle = '#ffffff44'; ctx.lineWidth = 2;
        ctx.strokeRect(left - 4, y - 4, w + 8, h + 8);
        /* lag */
        const lag = clamp(f.hpLag / f.maxHp, 0, 1);
        ctx.fillStyle = '#ffd400';
        ctx.fillRect(right ? left + w - w * lag : left, y, w * lag, h);
        /* hp */
        const p = clamp(f.hp / f.maxHp, 0, 1);
        const g = ctx.createLinearGradient(left, y, left, y + h);
        const c1 = p > 0.3 ? '#3ddc84' : '#ff4d6d', c2 = p > 0.3 ? '#0f9d58' : '#b3002d';
        g.addColorStop(0, c1); g.addColorStop(1, c2);
        ctx.fillStyle = g;
        ctx.fillRect(right ? left + w - w * p : left, y, w * p, h);
        /* stun bar */
        const s = clamp(f.stun / f.stunMax, 0, 1);
        if (s > 0.02) {
            ctx.fillStyle = 'rgba(255,212,0,.9)';
            ctx.fillRect(right ? left + w - (w - 6) * s : left + 3, y + h + 3, (w - 6) * s, 5);
        }
        /* name */
        shadowText(f.ch.name, right ? left + w : left, y + h + 30, 16, '#fff', right ? 'right' : 'left');
        ctx.restore();
    },
    pip(x, y, on, col) {
        ctx.save();
        ctx.beginPath(); ctx.arc(x, y, 9, 0, 7);
        ctx.fillStyle = on ? col : 'rgba(255,255,255,.15)';
        if (on) { ctx.shadowBlur = 14; ctx.shadowColor = col; }
        ctx.fill();
        ctx.strokeStyle = '#ffffff66'; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
    },
    gauges(f, x, y, right) {
        const w = 330, h = 18;
        const left = right ? x - w : x;
        ctx.save();
        /* beat gauge */
        ctx.fillStyle = 'rgba(6,3,14,.8)';
        ctx.fillRect(left - 3, y - 3, w + 6, h + 6);
        const bp = clamp(f.beat / MAX_BEAT, 0, 1);
        const burn = f.burnout > 0;
        ctx.fillStyle = burn ? '#ff5252' : (bp > 0.5 ? '#3dffb0' : '#ffd400');
        if (!burn) ctx.fillRect(right ? left + w - w * bp : left, y, w * bp, h);
        else {
            ctx.globalAlpha = 0.35 + Math.sin(f.auraT * 0.2) * 0.2;
            ctx.fillRect(left, y, w, h);
            ctx.globalAlpha = 1;
            shadowText('BURNOUT', left + w / 2, y + 15, 11, '#fff');
        }
        ctx.strokeStyle = '#ffffff33'; ctx.lineWidth = 2; ctx.strokeRect(left - 3, y - 3, w + 6, h + 6);
        for (let i = 1; i < 4; i++) {
            ctx.fillStyle = '#00000066';
            ctx.fillRect(left + w / 4 * i - 1, y, 2, h);
        }
        /* super gauge */
        const sy = y + 30, sh = 22;
        ctx.fillStyle = 'rgba(6,3,14,.8)';
        ctx.fillRect(left - 3, sy - 3, w + 6, sh + 6);
        for (let i = 0; i < 3; i++) {
            const seg = clamp((f.superM - i * 100) / 100, 0, 1);
            const sx = left + i * (w / 3) + 2;
            const sw = w / 3 - 4;
            ctx.fillStyle = 'rgba(255,255,255,.08)';
            ctx.fillRect(sx, sy, sw, sh);
            if (seg > 0) {
                const full = seg >= 1;
                const gg = ctx.createLinearGradient(sx, sy, sx, sy + sh);
                gg.addColorStop(0, full ? '#fff' : f.style.glow);
                gg.addColorStop(1, f.style.aura);
                ctx.fillStyle = gg;
                if (full && Math.sin(f.auraT * 0.25) > 0) { ctx.shadowBlur = 16; ctx.shadowColor = f.style.aura; }
                ctx.fillRect(right ? sx + sw - sw * seg : sx, sy, sw * seg, sh);
                ctx.shadowBlur = 0;
            }
        }
        if (f.superM >= SUPER_COST) shadowText('SUPER', left + w / 2, sy + 18, 12, '#fff', 'center', 14);
        ctx.restore();
    },
    combo(f, x, y, right) {
        ctx.save();
        const t = clamp((100 - f.comboT) / 6, 0, 1);
        ctx.globalAlpha = clamp(f.comboT / 25, 0, 1);
        shadowText(f.comboHits + ' HITS', x, y, 26, '#ffd400', 'center', 16);
        shadowText(f.comboDmg + ' DMG', x, y + 30, 15, '#fff', 'center');
        ctx.restore();
    },
    training(m) {
        const f = m.f1;
        const mv = f.move;
        ctx.save();
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.fillRect(W / 2 - 190, 130, 380, 78);
        const line1 = mv ? mv.name : (f.lastMoveName || '-');
        const line2 = mv ? ('S' + mv.startup + ' A' + mv.active + ' R' + mv.recovery + '  DMG ' + (mv.dmg || 0)) : 'PRESS A BUTTON';
        shadowText(line1, W / 2, 160, 14, '#3dffb0');
        shadowText(line2, W / 2, 190, 12, '#fff');
        ctx.restore();
    }
};

/* =====================================================================
   GAME  --  screens and flow
   ===================================================================== */
const STAGES = ['city', 'dojo', 'subway', 'roof'];
const MOTION_TEXT = {
    qcf: '↓↘→', qcb: '↓↙←', dp: '→↓↘',
    hcb: '←↙↓↘→', superF: '↓↘→↓↘→'
};

const Game = {
    screen: 'title', t: 0, fade: 0,
    mode: 'arcade', diff: 2, players: 1, controls: 'modern', selectFor: null, gfx: '3d',
    cur: [0, 3], lock: [false, false], stage: 'city',
    ladder: [], ladderI: 0, previews: [], menuI: 0, resultT: 0,
    stats: { wins: 0, losses: 0, best: 0 },

    boot() {
        try { this.stats = Object.assign(this.stats, JSON.parse(localStorage.getItem('sb1_stats') || '{}')); } catch (e) { }
        try { const c = localStorage.getItem('sb1_controls'); if (c === 'classic' || c === 'modern') this.controls = c; } catch (e) { }
        try { const g = localStorage.getItem('sb1_gfx'); if (g === '2d' || g === '3d') this.gfx = g; } catch (e) { }
        if (!R3D.available() || !R3D.init()) this.gfx = '2d';
        R3D.setVisible(this.gfx === '3d');
        labelTouch();
        this.previews = CHARS.map((c, i) => {
            const f = new Fighter(c.id, 0, PADS.cpu1, 0);
            f.state = 'idle'; f.anim = 'idle'; f.animT = i * 5;
            return f;
        });
        this.go('title');
    },
    save() { try { localStorage.setItem('sb1_stats', JSON.stringify(this.stats)); } catch (e) { } },
    go(s) {
        this.screen = s; this.t = 0; this.fade = 1;
        if (s === 'title' || s === 'mode' || s === 'select' || s === 'howto') Snd.setTrack(TRACKS.menu);
    },

    /* ------------------------------ update -------------------------- */
    update() {
        this.t++;
        if (this.fade > 0) this.fade = Math.max(0, this.fade - 0.05);
        const p1 = PADS.p1, p2 = PADS.p2;
        const tap = takeTap();
        switch (this.screen) {
            case 'title': this.titleUpdate(p1, p2, tap); break;
            case 'mode': this.modeUpdate(p1, tap); break;
            case 'howto': if (p1.anyPressed() || p2.anyPressed() || tap) { Snd.select(); this.go('mode'); } break;
            case 'select': this.selectUpdate(p1, p2, tap); break;
            case 'vs':
                for (const f of this.previews) f.updatePose();
                if (this.t > 120 || p1.anyPressed() || tap) this.startFight();
                break;
            case 'fight': Match.update(); break;
            case 'result': this.resultUpdate(p1, p2, tap); break;
            case 'wt': WT.update(p1, tap); break;
            case 'wtEnd': if (this.t > 40 && (p1.anyPressed() || tap)) { Snd.select(); this.go('title'); } break;
            case 'ending': if (this.t > 40 && (p1.anyPressed() || p2.anyPressed() || tap)) { Snd.select(); this.go('title'); } break;
        }
        if (this.screen === 'title' || this.screen === 'mode' || this.screen === 'select' || this.screen === 'vs')
            for (const f of this.previews) { if (this.screen !== 'vs') f.updatePose(); }
    },
    titleUpdate(p1, p2, tap) {
        if (p1.anyPressed() || p2.anyPressed() || tap || (this.t > 4 && TOUCH.start)) { Snd.select(); this.go('mode'); }
    },
    modeUpdate(p, tap) {
        const items = 9;
        if (tap) {
            /* tapping a row both moves the cursor and picks it */
            for (let i = 0; i < items; i++) {
                if (inRect(tap, MENU_ROW(i))) {
                    if (this.menuI === i || i < 5) { this.menuI = i; this.pickMode(i); }
                    else { this.menuI = i; Snd.menu(); }
                    return;
                }
            }
        }
        if (p.pressed2('down')) { this.menuI = (this.menuI + 1) % items; Snd.menu(); }
        if (p.pressed2('up')) { this.menuI = (this.menuI + items - 1) % items; Snd.menu(); }
        const lr = p.pressed2('right') || p.pressed2('left');
        if (this.menuI === 5 && lr) { this.toggleControls(); }
        if (this.menuI === 6 && lr) { this.toggleGfx(); }
        if (this.menuI === 7) {
            if (p.pressed2('right')) { this.diff = clamp(this.diff + 1, 1, 4); Snd.menu(); }
            if (p.pressed2('left')) { this.diff = clamp(this.diff - 1, 1, 4); Snd.menu(); }
        }
        if (this.menuI === 8 && lr) { Snd.musicOn = !Snd.musicOn; Snd.menu(); }
        if (p.anyPressed()) this.pickMode(this.menuI);
    },
    pickMode(i) {
        Snd.select();
        if (i === 0) {
            this.mode = 'worldtour'; this.players = 1;
            if (WT.hasSave() && WT.resume()) this.go('wt');
            else { this.selectFor = 'wt'; this.lock = [false, false]; this.go('select'); }
        }
        else if (i === 1) { this.mode = 'arcade'; this.players = 1; this.selectFor = null; this.lock = [false, false]; this.go('select'); }
        else if (i === 2) { this.mode = 'versus'; this.players = 2; this.selectFor = null; this.lock = [false, false]; this.go('select'); }
        else if (i === 3) { this.mode = 'training'; this.players = 1; this.selectFor = null; this.lock = [false, false]; this.go('select'); }
        else if (i === 4) { this.go('howto'); }
        else if (i === 5) { this.toggleControls(); }
        else if (i === 6) { this.toggleGfx(); }
        else if (i === 7) { this.diff = this.diff % 4 + 1; }
        else if (i === 8) { Snd.musicOn = !Snd.musicOn; }
    },
    toggleControls() {
        this.controls = this.controls === 'modern' ? 'classic' : 'modern';
        try { localStorage.setItem('sb1_controls', this.controls); } catch (e) { }
        labelTouch();
        Snd.menu();
    },
    toggleGfx() {
        if (!R3D.ok) { Snd.whiff(); return; }
        this.gfx = this.gfx === '3d' ? '2d' : '3d';
        try { localStorage.setItem('sb1_gfx', this.gfx); } catch (e) { }
        R3D.setVisible(this.gfx === '3d');
        R3D.stageName = '';           /* force a rebuild on the way back in */
        Snd.menu();
    },
    selectUpdate(p1, p2, tap) {
        if (tap) {
            for (let i = 0; i < CHARS.length; i++) {
                if (!inRect(tap, CARD_RECT(i))) continue;
                const who = (this.players === 2 && this.lock[0]) ? 1 : 0;
                if (this.cur[who] === i) { this.lock[who] = true; Snd.select(); }
                else { this.cur[who] = i; Snd.menu(); }
                break;
            }
        }
        const move = (pad, i) => {
            if (this.lock[i]) {
                if (pad.pressed('LK') || pad.pressed('MK') || pad.pressed('HK')) { this.lock[i] = false; Snd.menu(); }
                return;
            }
            let c = this.cur[i];
            if (pad.pressed2('right')) { c = (c + 1) % CHARS.length; Snd.menu(); }
            if (pad.pressed2('left')) { c = (c + CHARS.length - 1) % CHARS.length; Snd.menu(); }
            if (pad.pressed2('down')) { c = (c + 3) % CHARS.length; Snd.menu(); }
            if (pad.pressed2('up')) { c = (c + 3) % CHARS.length; Snd.menu(); }
            this.cur[i] = c;
            if (pad.pressed('LP') || pad.pressed('MP') || pad.pressed('HP')) { this.lock[i] = true; Snd.select(); }
        };
        move(p1, 0);
        if (this.players === 2) move(p2, 1);
        else if (!this.lock[0]) {
            /* CPU keeps browsing until the player commits */
            if (this.t % 40 === 0) this.cur[1] = rndi(0, CHARS.length);
        }
        if (this.lock[0] && this.selectFor === 'wt') {
            this.selectFor = null;
            WT.begin(CHARS[this.cur[0]].id);
            this.go('wt');
            return;
        }
        if (this.lock[0] && (this.players === 1 || this.lock[1])) {
            if (this.players === 1) {
                if (this.mode === 'arcade') {
                    this.ladder = CHARS.map(c => c.id).filter(id => id !== CHARS[this.cur[0]].id);
                    /* shuffle, keep the boss last */
                    this.ladder = this.ladder.filter(id => id !== 'volt');
                    for (let i = this.ladder.length - 1; i > 0; i--) { const j = rndi(0, i + 1); const t = this.ladder[i]; this.ladder[i] = this.ladder[j]; this.ladder[j] = t; }
                    this.ladder.push('volt');
                    this.ladderI = 0;
                    this.cur[1] = CHARS.findIndex(c => c.id === this.ladder[0]);
                }
            }
            this.stage = pick(STAGES);
            this.go('vs');
        }
    },
    startFight() {
        const p1id = CHARS[this.cur[0]].id, p2id = CHARS[this.cur[1]].id;
        const cpu = this.players === 2 ? 0 : (this.mode === 'training' ? 0 : this.diff);
        Match.start({
            mode: this.mode, stage: this.stage,
            p1: p1id, p2: p2id,
            pad1: PADS.p1, pad2: this.players === 2 ? PADS.p2 : PADS.cpu2,
            cpu2: cpu,
            onEnd: (w) => this.matchOver(w)
        });
        Snd.setTrack(TRACKS[p2id === 'volt' ? 'boss' : this.stage] || TRACKS.city);
        this.go('fight');
    },
    matchOver(winner) {
        this.winnerIsP1 = winner === Match.f1;
        if (this.mode === 'arcade') {
            if (this.winnerIsP1) { this.stats.wins++; this.ladderI++; }
            else this.stats.losses++;
            this.stats.best = Math.max(this.stats.best, this.ladderI);
            this.save();
        }
        this.go('result');
    },
    resultUpdate(p1, p2, tap) {
        if (this.t < 60) return;
        if (!(p1.anyPressed() || p2.anyPressed() || tap)) return;
        Snd.select();
        if (this.mode === 'arcade' && this.winnerIsP1) {
            if (this.ladderI >= this.ladder.length) { this.go('ending'); return; }
            this.cur[1] = CHARS.findIndex(c => c.id === this.ladder[this.ladderI]);
            this.stage = pick(STAGES);
            Match.f1.wins = 0; Match.f2.wins = 0;
            this.go('vs');
        } else if (this.mode === 'training') {
            this.go('select');
        } else {
            this.go('mode');
        }
    },

    /* ------------------------------ draw ---------------------------- */
    draw() {
        ctx.setTransform(RS, 0, 0, RS, 0, 0);
        ctx.clearRect(0, 0, W, H);
        switch (this.screen) {
            case 'title': this.drawTitle(); break;
            case 'mode': this.drawMode(); break;
            case 'howto': this.drawHowto(); break;
            case 'select': this.drawSelect(); break;
            case 'vs': this.drawVs(); break;
            case 'fight': this.drawFight(); break;
            case 'result': this.drawFight(); this.drawResult(); break;
            case 'wt': WT.draw(); break;
            case 'wtEnd': this.drawWtEnd(); break;
            case 'ending': this.drawEnding(); break;
        }
        if (this.fade > 0) {
            ctx.fillStyle = 'rgba(0,0,0,' + this.fade + ')';
            ctx.fillRect(0, 0, W, H);
        }
    },
    menuBg() {
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, '#12061f'); g.addColorStop(0.6, '#1b0630'); g.addColorStop(1, '#070312');
        ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.globalAlpha = 0.14;
        ctx.strokeStyle = '#ff2e63'; ctx.lineWidth = 2;
        for (let i = 0; i < 22; i++) {
            const y = (i * 46 + this.t * 0.7) % (H + 60) - 30;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y - 30); ctx.stroke();
        }
        ctx.globalAlpha = 0.1;
        ctx.strokeStyle = '#00f3ff';
        for (let i = 0; i < 16; i++) {
            const x = (i * 90 - this.t * 0.5) % (W + 90);
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 40, H); ctx.stroke();
        }
        ctx.restore();
    },
    drawTitle() {

        const bob = Math.sin(this.t * 0.04) * 6;

    drawMode() {

        ctx.save(); ctx.translate(a.x, a.y); ctx.scale(1.5, 1.5); ctx.translate(-a.x, -a.y); drawFighter(a, 1); ctx.restore();
        ctx.save(); ctx.translate(b.x, b.y); ctx.scale(1.5, 1.5); ctx.translate(-b.x, -b.y); drawFighter(b, 1); ctx.restore();
        const s = 1 + Math.max(0, 1 - this.t / 14) * 3;
        ctx.save(); ctx.translate(W / 2, 300); ctx.scale(s, s);
        shadowText('VS', 0, 0, 76, '#ffd400', 'center', 30);

    drawFight() {

        R3D.syncCamera((m.f1.x + m.f2.x) / 2, Math.abs(m.f1.x - m.f2.x));
        R3D.render();
        FX.draw3d();
        if (Cam.flash > 0.01) {
            ctx.save();

    drawWtEnd() {

    drawEnding() {

        const f = this.previews[this.cur[0]];
        f.x = W / 2; f.y = 470; f.facing = 1; f.anim = 'win'; f.auraT = this.t; f.updatePose();
        ctx.save(); ctx.translate(f.x, f.y); ctx.scale(1.6, 1.6); ctx.translate(-f.x, -f.y);
        drawFighter(f, 1); ctx.restore();
        shadowText(c.name + ' TOOK THE STREET', W / 2, 180, 18, '#fff');
        shadowText('"' + c.quote + '"', W / 2, 540, 13, '#00f3ff');
        shadowText('THE NEON GOES QUIET. FOR NOW.', W / 2, 580, 12, '#8a7fa8');
        if (Math.floor(this.t / 22) % 2 === 0) shadowText('PRESS ANY BUTTON', W / 2, 640, 16, '#ffd400');
    }
};


/* =====================================================================
   3D RENDERER
   The fight itself stays on a flat plane - the same hitboxes, the same
   frame data - and this module draws that plane in three dimensions, the
   way a modern 2.5D fighter does. Fighters are built from the very same
   eleven-joint pose the 2D renderer uses, so every animation, every
   attack and every World Tour street works here untouched.
   ===================================================================== */
const S3 = 0.02;                 /* game pixels -> world units */
const UP3 = { x: 0, y: 1, z: 0 };

const R3D = {
    ok: false, on: false, renderer: null, scene: null, camera: null,
    rigs: {}, stageGroup: null, stageName: '', originX: STAGE_W / 2,
    projGroup: null, projPool: [], lights: null, shakeX: 0, shakeY: 0,
    _v: null, _up: null,

    available() { return typeof THREE !== 'undefined'; },

    init() {
        if (this.ok || !this.available()) return this.ok;
        const canvas = document.getElementById('g3d');
        this.renderer = new THREE.WebGLRenderer({ canvas, antialias: !LOWFX, alpha: false });
        this.renderer.setPixelRatio(Math.min(devicePixelRatio || 1, LOWFX ? 1.5 : 2));
        this.renderer.setSize(W, H, false);
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(34, W / H, 0.1, 400);
        this.scene.fog = new THREE.Fog(0x0a0618, 26, 90);

        const amb = new THREE.AmbientLight(0xffffff, 0.55);
        const key = new THREE.DirectionalLight(0xffffff, 0.85);
        key.position.set(4, 12, 9);
        const rimA = new THREE.PointLight(0xff2e63, 1.5, 60);
        const rimB = new THREE.PointLight(0x00f3ff, 1.4, 60);
        rimA.position.set(-9, 5, -5);
        rimB.position.set(9, 5, -5);
        this.scene.add(amb, key, rimA, rimB);
        this.lights = { amb, key, rimA, rimB };

        this.stageGroup = new THREE.Group();
        this.projGroup = new THREE.Group();
        this.scene.add(this.stageGroup, this.projGroup);

        this._v = new THREE.Vector3();
        this._up = new THREE.Vector3(0, 1, 0);
        this.ok = true;
        return true;
    },

    /* ---- coordinate mapping: game space -> world space ---- */
    x3(gx) { return (gx - this.originX) * S3; },
    y3(gy) { return (GROUND_Y - gy) * S3; },
    v3(gx, gy, z) { return new THREE.Vector3(this.x3(gx), this.y3(gy), z || 0); },

    /* ---- a fighter rig, built once and posed every frame ---- */
    rigFor(f, key) {
        /* keyed by slot AND character, or a rematch would wear the last
           fighter's colours */
        const id = (key || 'f' + f.side) + ':' + f.ch.id + ':' + f.style.gi;
        if (this.rigs[id]) return this.rigs[id];
        const S = f.style;
        const mat = (col, emissive, emi) => new THREE.MeshLambertMaterial({
            color: new THREE.Color(col),
            emissive: new THREE.Color(emissive || '#000'),
            emissiveIntensity: emi === undefined ? 0.35 : emi
        });
        const g = new THREE.Group();
        const cyl = new THREE.CylinderGeometry(1, 1, 1, 10);
        const sph = new THREE.SphereGeometry(1, 14, 10);
        const box = new THREE.BoxGeometry(1, 1, 1);

        const skinM = mat(S.skin);
        const giM = mat(S.gi, S.gi, 0.06);
        const giDM = mat(S.giDark, S.giDark, 0.05);
        const trimM = mat(S.trim, S.trim, 0.7);
        const hairM = mat(S.hair);
        const bootM = mat('#1a1a22');

        const limb = (m) => { const x = new THREE.Mesh(cyl, m); g.add(x); return x; };
        const ball = (m, r) => { const x = new THREE.Mesh(sph, m); x.scale.setScalar(r); g.add(x); return x; };

        const rig = {
            group: g,
            armF: [limb(giM), limb(giM)], armB: [limb(giDM), limb(giDM)],
            legF: [limb(giM), limb(giM)], legB: [limb(giDM), limb(giDM)],
            neck: limb(skinM),
            torso: new THREE.Mesh(box, giM),
            belt: new THREE.Mesh(box, trimM),
            head: ball(skinM, 1), hair: ball(hairM, 1),
            handF: ball(trimM, 1), handB: ball(trimM, 1),
            footF: ball(bootM, 1), footB: ball(bootM, 1),
            shadow: new THREE.Mesh(new THREE.CircleGeometry(1, 18),
                new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.36 })),
            aura: new THREE.PointLight(new THREE.Color(S.aura), 0, 8),
            mats: { giM, trimM, skinM }
        };
        g.add(rig.torso, rig.belt);
        rig.shadow.rotation.x = -Math.PI / 2;
        g.add(rig.shadow);
        g.add(rig.aura);
        this.scene.add(g);
        this.rigs[id] = rig;
        rig.id = id;
        return rig;
    },

    segment(mesh, a, b, r) {
        const v = this._v;
        v.subVectors(b, a);
        const len = Math.max(0.02, v.length());
        mesh.position.copy(a).add(b).multiplyScalar(0.5);
        v.normalize();
        mesh.quaternion.setFromUnitVectors(this._up, v);
        mesh.scale.set(r, len, r);
    },

    /* pose the rig from the fighter's current 2D skeleton */
    syncFighter(f, key) {
        const rig = this.rigFor(f, key);
        const P = poseWorld(f, f.pose);
        const b = f.style.build;
        const zF = 0.17 * b, zB = -0.17 * b, zLF = 0.11 * b, zLB = -0.11 * b;
        const V = (p, z) => new THREE.Vector3(this.x3(p.x), this.y3(p.y), z);

        const s1 = V(P.s1, zF), e1 = V(P.e1, zF), h1 = V(P.h1, zF);
        const s2 = V(P.s2, zB), e2 = V(P.e2, zB), h2 = V(P.h2, zB);
        const g1 = V(P.g1, zLF), k1 = V(P.k1, zLF), f1 = V(P.f1, zLF);
        const g2 = V(P.g2, zLB), k2 = V(P.k2, zLB), f2 = V(P.f2, zLB);
        const ch = V(P.ch, 0), pel = V(P.pel, 0), hd = V(P.hd, 0);

        const R = 0.115 * b;   /* matches the 2D line weights once scaled */
        this.segment(rig.armF[0], s1, e1, R * 1.05); this.segment(rig.armF[1], e1, h1, R * 0.95);
        this.segment(rig.armB[0], s2, e2, R); this.segment(rig.armB[1], e2, h2, R * 0.9);
        this.segment(rig.legF[0], g1, k1, R * 1.35); this.segment(rig.legF[1], k1, f1, R * 1.15);
        this.segment(rig.legB[0], g2, k2, R * 1.3); this.segment(rig.legB[1], k2, f2, R * 1.1);
        this.segment(rig.neck, ch, hd, R * 0.85);

        /* torso: a slab from the shoulders down to the hips */
        const mid = ch.clone().add(pel).multiplyScalar(0.5);
        rig.torso.position.copy(mid);
        const spine = new THREE.Vector3().subVectors(ch, pel);
        const len = Math.max(0.1, spine.length());
        rig.torso.quaternion.setFromUnitVectors(this._up, spine.normalize());
        rig.torso.scale.set(0.52 * b, len * 1.14, 0.34 * b);

        rig.belt.position.copy(pel);
        rig.belt.quaternion.copy(rig.torso.quaternion);
        rig.belt.scale.set(0.56 * b, 0.1 * b, 0.37 * b);

        rig.head.position.copy(hd);
        rig.head.scale.setScalar(0.31 * b);
        rig.hair.position.copy(hd);
        rig.hair.position.y += 0.07 * b;
        rig.hair.position.x -= 0.03 * b * f.facing;
        rig.hair.scale.set(0.33 * b, 0.28 * b, 0.33 * b);

        rig.handF.position.copy(h1); rig.handF.scale.setScalar(0.15 * b);
        rig.handB.position.copy(h2); rig.handB.scale.setScalar(0.14 * b);
        rig.footF.position.copy(f1); rig.footF.scale.setScalar(0.16 * b);
        rig.footB.position.copy(f2); rig.footB.scale.setScalar(0.15 * b);

        /* blob shadow, faded by height off the floor */
        const lift = clamp(1 - (GROUND_Y - f.y) / 300, 0.2, 1);
        rig.shadow.position.set(this.x3(f.x), 0.012, 0);
        rig.shadow.scale.setScalar(0.55 * b * lift);
        rig.shadow.material.opacity = 0.38 * lift;

        /* glow when something special is happening */
        const hot = (f.exGlow > 0 || f.superFreeze > 0 || (f.move && f.move.type === 'super')) ? 3.4
            : (f.hitFlash > 0 ? 2.2 : 0);
        rig.aura.intensity = lerp(rig.aura.intensity, hot, 0.35);
        rig.aura.position.set(this.x3(f.x), this.y3(f.y - 100), 0.6);
        if (f.hitFlash > 0) rig.aura.color.set('#ffffff');
        else rig.aura.color.set(f.style.aura);

        rig.group.visible = true;
        return rig;
    },

    hideUnused(activeIds) {
        for (const id in this.rigs) {
            if (activeIds.indexOf(id) < 0) this.rigs[id].group.visible = false;
        }
    },

    /* ---- projectiles as real objects in the scene ---- */
    syncProjectiles() {
        const list = Projectiles.list;
        while (this.projPool.length < list.length) {
            const m = new THREE.Mesh(
                new THREE.SphereGeometry(1, 12, 10),
                new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 })
            );
            const light = new THREE.PointLight(0xffffff, 2, 9);
            m.add(light);
            m.userData.light = light;
            this.projGroup.add(m);
            this.projPool.push(m);
        }
        this.projPool.forEach((m, i) => {
            const p = list[i];
            if (!p) { m.visible = false; return; }
            m.visible = true;
            m.position.set(this.x3(p.x), this.y3(p.y), 0);
            const r = p.r * S3 * (p.beam ? 1.5 : 1.1);
            m.scale.set(r * (p.beam ? 3.2 : 1), r, r);
            m.material.color.set(p.col);
            m.userData.light.color.set(p.col);
            m.userData.light.intensity = p.beam ? 5 : 2.2;
        });
    },

    /* ---- camera: rails behind the action, like a broadcast fighter ---- */
    syncCamera(midX, sep, height) {
        const cam = this.camera;
        const dist = clamp(6.6 + sep * S3 * 0.8, 6.6, 13);
        const shake = Cam.shake * S3 * 1.4;
        cam.position.set(
            this.x3(midX) + rnd(shake, -shake),
            (height === undefined ? 1.85 : height) + rnd(shake, -shake) * 0.5,
            dist
        );
        cam.lookAt(this.x3(midX), 1.45, 0);
    },

    /* Status screen framing: orbit the fighter and look past them, so they
       sit on the left of the frame with the panel beside them. */
    portraitCamera(gx, angle) {
        const cam = this.camera;
        const cx = this.x3(gx);
        const d = 6.3;                       /* far enough to frame head to heel */
        const sa = Math.sin(angle), ca = Math.cos(angle);
        cam.position.set(cx + sa * d, 1.95, ca * d);
        /* aim past the fighter, along the camera's own right, so they sit on
           the left of frame however far round the turntable has gone */
        cam.lookAt(cx + ca * 1.75, 1.62, -sa * 1.75);
    },

    project(gx, gy) {
        this._v.set(this.x3(gx), this.y3(gy), 0);
        this._v.project(this.camera);
        return { x: (this._v.x * 0.5 + 0.5) * W, y: (-this._v.y * 0.5 + 0.5) * H };
    },

    render() { this.renderer.render(this.scene, this.camera); },

    setVisible(on) {
        const c = document.getElementById('g3d');
        if (c) c.style.display = on ? 'block' : 'none';
    }
};

function gridTexture(colA, colB, line) {
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = colA; g.fillRect(0, 0, 128, 128);
    g.strokeStyle = line; g.lineWidth = 6;
    g.strokeRect(0, 0, 128, 128);
    g.strokeStyle = colB; g.lineWidth = 2;
    g.beginPath(); g.moveTo(64, 0); g.lineTo(64, 128); g.moveTo(0, 64); g.lineTo(128, 64); g.stroke();
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
}
function windowTexture(base, glow) {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 128;
    const g = c.getContext('2d');
    g.fillStyle = base; g.fillRect(0, 0, 64, 128);
    for (let y = 6; y < 124; y += 12) {
        for (let x = 6; x < 60; x += 14) {
            if (Math.random() < 0.45) continue;
            g.fillStyle = Math.random() < 0.5 ? glow : '#ffffff';
            g.globalAlpha = 0.5 + Math.random() * 0.5;
            g.fillRect(x, y, 8, 7);
        }
    }
    g.globalAlpha = 1;
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
}

const STAGE3D = {
    build(name, width) {
        const R = R3D;
        const grp = R.stageGroup;
        while (grp.children.length) {
            const c = grp.children.pop();
            if (c.geometry) c.geometry.dispose();
            grp.remove(c);
        }
        R.stageName = name;
        const half = (width || STAGE_W) * S3 / 2;
        const theme = {
            city: { sky: 0x140a2a, fog: 0x160b2e, floorA: '#1a0f2e', floorB: '#ff2e63', line: '#3a1f5e', glow: '#ff2e63' },
            dojo: { sky: 0x2a1b12, fog: 0x2a1810, floorA: '#3d2517', floorB: '#ffb454', line: '#5a3a22', glow: '#ff9d3d' },
            subway: { sky: 0x0b1420, fog: 0x0a1620, floorA: '#0e1c26', floorB: '#7cf7ff', line: '#1d3a49', glow: '#7cf7ff' },
            roof: { sky: 0x3a1a4a, fog: 0x4a2450, floorA: '#2a1830', floorB: '#ffd166', line: '#553055', glow: '#ffb457' }
        }[name] || { sky: 0x140a2a, fog: 0x160b2e, floorA: '#1a0f2e', floorB: '#ff2e63', line: '#3a1f5e', glow: '#ff2e63' };

        R.scene.background = new THREE.Color(theme.sky);
        R.scene.fog.color = new THREE.Color(theme.fog);

        /* floor */
        const tex = gridTexture(theme.floorA, theme.line, theme.floorB);
        tex.repeat.set(Math.round(half * 2 / 1.6), 12);
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(half * 2 + 20, 26),
            new THREE.MeshLambertMaterial({ map: tex })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.z = -4;
        grp.add(floor);

        /* the neon strip the fighters stand on */
        const strip = new THREE.Mesh(
            new THREE.PlaneGeometry(half * 2 + 20, 0.09),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(theme.floorB) })
        );
        strip.rotation.x = -Math.PI / 2;
        strip.position.set(0, 0.02, 1.6);
        grp.add(strip);

        if (name === 'dojo') this.dojo(grp, half, theme);
        else if (name === 'subway') this.subway(grp, half, theme);
        else if (name === 'roof') this.roof(grp, half, theme);
        else this.city(grp, half, theme);
    },

    city(grp, half, theme) {
        const tex = windowTexture('#1b1038', '#ff7ade');
        const tex2 = windowTexture('#241247', '#78f0ff');
        seed = 41;
        for (let i = 0; i < 46; i++) {
            const w = 1.2 + srnd() * 2.2;
            const h = 4 + srnd() * 14;
            const d = 1.5 + srnd() * 2;
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(w, h, d),
                new THREE.MeshLambertMaterial({ map: (i % 2 ? tex : tex2), emissive: 0x140a28, emissiveIntensity: 0.6 })
            );
            m.position.set(-half - 6 + srnd() * (half * 2 + 12), h / 2, -9 - srnd() * 22);
            grp.add(m);
        }
        /* two big signs behind the action */
        [[-half * 0.5, '#ff2e63'], [half * 0.5, '#00f3ff']].forEach(s => {
            const sign = new THREE.Mesh(
                new THREE.PlaneGeometry(3.4, 1.1),
                new THREE.MeshBasicMaterial({ color: new THREE.Color(s[1]), transparent: true, opacity: 0.85 })
            );
            sign.position.set(s[0], 6.5, -8.5);
            grp.add(sign);
            const l = new THREE.PointLight(new THREE.Color(s[1]), 2.2, 26);
            l.position.set(s[0], 6, -6);
            grp.add(l);
        });
    },
    dojo(grp, half, theme) {
        const wall = new THREE.Mesh(
            new THREE.BoxGeometry(half * 2 + 14, 9, 1),
            new THREE.MeshLambertMaterial({ color: 0x3d2517 })
        );
        wall.position.set(0, 4.5, -7);
        grp.add(wall);
        const banner = new THREE.Mesh(
            new THREE.PlaneGeometry(5, 5.4),
            new THREE.MeshLambertMaterial({ color: 0x8c1c1c, emissive: 0x2a0808, emissiveIntensity: 0.6 })
        );
        banner.position.set(0, 5, -6.4);
        grp.add(banner);
        for (let i = -4; i <= 4; i++) {
            if (!i) continue;
            const lamp = new THREE.Mesh(
                new THREE.SphereGeometry(0.34, 12, 10),
                new THREE.MeshBasicMaterial({ color: 0xff9d3d })
            );
            lamp.position.set(i * 2.6, 5.4, -5.6);
            grp.add(lamp);
            const l = new THREE.PointLight(0xff9d3d, 1.1, 12);
            l.position.copy(lamp.position);
            grp.add(l);
        }
        for (let i = -6; i <= 6; i++) {
            const beam = new THREE.Mesh(
                new THREE.BoxGeometry(0.22, 9, 0.22),
                new THREE.MeshLambertMaterial({ color: 0x2a1a10 })
            );
            beam.position.set(i * 2.2, 4.5, -6.3);
            grp.add(beam);
        }
    },
    subway(grp, half, theme) {
        const wall = new THREE.Mesh(
            new THREE.BoxGeometry(half * 2 + 14, 10, 1),
            new THREE.MeshLambertMaterial({ color: 0x0e1c26 })
        );
        wall.position.set(0, 5, -8);
        grp.add(wall);
        const tunnel = new THREE.Mesh(
            new THREE.BoxGeometry(half * 2 + 12, 4.4, 0.4),
            new THREE.MeshBasicMaterial({ color: 0x02060a })
        );
        tunnel.position.set(0, 3.4, -7.4);
        grp.add(tunnel);
        for (let i = -6; i <= 6; i++) {
            const p = new THREE.Mesh(
                new THREE.BoxGeometry(0.55, 7, 0.55),
                new THREE.MeshLambertMaterial({ color: 0x1d3a49 })
            );
            p.position.set(i * 3.1, 3.5, -5.4);
            grp.add(p);
            const strip = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.12, 0.6),
                new THREE.MeshBasicMaterial({ color: 0x7cf7ff })
            );
            strip.position.set(i * 3.1, 6.6, -5.4);
            grp.add(strip);
        }
        const l = new THREE.PointLight(0x7cf7ff, 2, 40);
        l.position.set(0, 7, -3);
        grp.add(l);
    },
    roof(grp, half, theme) {
        seed = 77;
        for (let i = 0; i < 26; i++) {
            const h = 3 + srnd() * 9;
            const m = new THREE.Mesh(
                new THREE.BoxGeometry(1.6 + srnd() * 2, h, 1.6),
                new THREE.MeshLambertMaterial({ color: 0x3a2450 })
            );
            m.position.set(-half - 4 + srnd() * (half * 2 + 8), h / 2 - 3.2, -12 - srnd() * 16);
            grp.add(m);
        }
        const sun = new THREE.Mesh(
            new THREE.CircleGeometry(3.4, 26),
            new THREE.MeshBasicMaterial({ color: 0xffe08a })
        );
        sun.position.set(0, 4.4, -20);
        grp.add(sun);
        const l = new THREE.PointLight(0xffb457, 2.4, 60);
        l.position.set(0, 6, -8);
        grp.add(l);
        const parapet = new THREE.Mesh(
            new THREE.BoxGeometry(half * 2 + 14, 0.7, 0.5),
            new THREE.MeshLambertMaterial({ color: 0x2a1830 })
        );
        parapet.position.set(0, 0.35, -6);
        grp.add(parapet);
    }
};

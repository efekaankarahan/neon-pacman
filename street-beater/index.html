    resume() {
        const s = this.load();
        if (!s) return false;
        this.s = s;
        if (!this.s.slots) this.equipDefaults();
        this.enter();
        return true;
    },
    equipDefaults() {
        const base = CHAR_BY_ID[this.s.style];
        const keys = Object.keys(base.specials).filter(k => !base.specials[k].air);
        this.s.slots = {
            neutral: { char: base.id, key: keys[0] },
            down: { char: base.id, key: keys[1] || keys[0] },
            forward: { char: base.id, key: keys[2] || keys[0] }
        };
    },
    enter() {
        this.area = WT_AREAS[this.s.area] || WT_AREAS.downtown;
        this.player = new Fighter(this.s.style, 0, PADS.cpu1, 0);
        this.player.state = 'idle'; this.player.anim = 'idle';
        this.player.x = this.s.x; this.player.y = GROUND_Y;
        this.npcCache = {};
        this.camX = this.s.x;
        this.mode = 'walk'; this.dialog = null;
        Snd.setTrack(TRACKS[this.area.stage] || TRACKS.city);
    },

    /* --------------------------- progression --------------------------- */
    maxHpOf() { return CHAR_BY_ID[this.s.style].stats.hp + (this.s.level - 1) * 30 + this.s.hpBonus; },
    dmgMulOf() { return 1 + (this.s.level - 1) * 0.03 + this.s.atkBonus; },
    defMulOf() { return 1 / (1 + (this.s.defBonus || 0)); },
    xpNeeded() { return this.s.level * 100; },
    gainXp(n) {
        this.s.xp += n;
        while (this.s.xp >= this.xpNeeded() && this.s.level < 20) {
            this.s.xp -= this.xpNeeded();
            this.s.level++;
            this.toastUp('LEVEL ' + this.s.level + '!');
            Snd.bell();
        }
    },
    toastUp(t) { this.toast = t; this.toastT = 150; },
    questText() {
        const q = WT_QUESTS.find(q => !q.done(this.s));
        return q ? q.text : 'THE CITY IS YOURS - FREE ROAM';
    },
    /* every special the player may put in a slot */
    pool() {
        const base = CHAR_BY_ID[this.s.style];
        const out = Object.keys(base.specials)
            .filter(k => !base.specials[k].air)
            .map(k => ({ char: base.id, key: k }));
        for (const l of this.s.learned) {
            if (!out.some(o => o.char === l.char && o.key === l.key)) out.push(l);
        }
        return out;
    },
    moveOf(ref) {
        const c = CHAR_BY_ID[ref.char];
        return c && c.specials[ref.key] ? c.specials[ref.key] : null;
    },

    /* Build the avatar character used in battle: the player's base with the
       equipped specials re-motioned so each slot has its own input. */
    buildAvatar() {
        const base = CHAR_BY_ID[this.s.style];
        const specials = {};
        WT_SLOTS.forEach(slot => {
            const ref = this.s.slots[slot];
            const mv = this.moveOf(ref);
            if (!mv) return;
            const copy = Object.assign({}, mv);
            copy.motion = SLOT_MOTION[slot];
            copy.box = Object.assign({}, mv.box);
            copy.pose = Object.assign({}, mv.pose);
            if (mv.projectile) copy.projectile = Object.assign({}, mv.projectile);
            specials[slot] = copy;
        });
        const avatar = Object.assign({}, base, {
            id: 'avatar', name: 'YOU', title: 'STREET TOURIST',
            specials,
            modernSlots: { neutral: specials.neutral, down: specials.down, forward: specials.forward, air: null },
            stats: Object.assign({}, base.stats, { hp: this.maxHpOf() })
        });
        CHAR_BY_ID.avatar = avatar;
        return avatar;
    },

    /* ----------------------------- battle ------------------------------ */
    startFight(npc) {
        this.pendingNpc = npc;
        this.buildAvatar();
        const oppLvl = npc.level || 1;
        Match.start({
            mode: 'worldtour', stage: this.area.stage,
            p1: 'avatar', p2: npc.char,
            pad1: PADS.p1, pad2: PADS.cpu2,
            cpu2: clamp(1 + Math.floor(oppLvl / 3), 1, 4),
            onEnd: w => this.fightOver(w === Match.f1)
        });
        Match.f1.dmgMul = this.dmgMulOf();
        Match.f1.defMul = this.defMulOf();
        Match.f2.maxHp = Math.round(Match.f2.maxHp * (0.8 + oppLvl * 0.05));
        Match.f2.hp = Match.f2.maxHp;
        Match.f2.dmgMul = 0.85 + oppLvl * 0.03;
        Match.f1.wtName = 'YOU';
        Snd.setTrack(npc.kind === 'boss' ? TRACKS.boss : (TRACKS[this.area.stage] || TRACKS.city));
        Game.go('fight');
    },
    fightOver(won) {
        const npc = this.pendingNpc;
        this.pendingNpc = null;
        if (won && npc) {
            this.s.defeated[npc.id] = true;
            this.gainXp(npc.xp || 50);
            this.s.money += npc.money || 50;
            if (npc.teach) {
                if (!this.s.learned.some(l => l.char === npc.teach.char && l.key === npc.teach.key))
                    this.s.learned.push(npc.teach);
            }
            if (npc.after) npc.after(this.s);
            if (npc.kind === 'boss') this.s.cleared = true;
            this.dialog = {
                name: npc.name, lines: (npc.win || ['...']).slice(),
                i: 0, reward: { xp: npc.xp || 50, money: npc.money || 50, teach: npc.teach || null }
            };
            this.mode = 'dialog';
        } else if (npc) {
            this.dialog = { name: npc.name, lines: ['Come back when the street has taught you more.'], i: 0 };
            this.mode = 'dialog';
        }
        this.save();
        Snd.setTrack(TRACKS[this.area.stage] || TRACKS.city);
        Game.go('wt');
        if (this.s.cleared && npc && npc.kind === 'boss') this.endingPending = true;
    },

    /* ----------------------------- update ------------------------------ */
    update(p, tap) {
        this.walkT++;
        if (this.toastT > 0) this.toastT--;
        if (this.mode === 'dialog') return this.dialogUpdate(p, tap);
        if (this.mode === 'status') return this.statusUpdate(p, tap);
        if (this.mode === 'shop') return this.shopUpdate(p, tap);

        const sp = 4.2;
        let moving = 0;
        if (p.down('right')) moving = 1;
        else if (p.down('left')) moving = -1;
        this.s.x = clamp(this.s.x + moving * sp, 40, this.area.width - 40);
        if (moving) this.player.facing = moving;
        this.player.setAnim(moving ? 'walkF' : 'idle');
        this.player.x = this.s.x; this.player.y = GROUND_Y;
        this.player.auraT = this.walkT;
        this.player.updatePose();

        const half = W / 2 / 0.92;
        this.camX = lerp(this.camX, clamp(this.s.x, half, Math.max(half, this.area.width - half)), 0.14);

        /* what is in reach? */
        const npc = this.nearNpc();
        const exit = this.nearExit();
        this.prompt = '';
        if (npc) this.prompt = 'TALK TO ' + npc.name;
        else if (exit) this.prompt = 'GO TO ' + exit.label;

        if (p.pressed('start')) { this.mode = 'status'; this.statusI = 0; Snd.menu(); return; }
        /* on a phone, tapping the street is the same as pressing a button */
        if (!BTNS.some(b => p.pressed(b)) && !tap) return;

        if (npc) this.talkTo(npc);
        else if (exit) {
            if (exit.need && !exit.need(this.s)) {
                this.dialog = { name: 'LOCKED', lines: [exit.needText || 'Not yet.'], i: 0 };
                this.mode = 'dialog';
                return;
            }
            this.s.area = exit.to; this.s.x = exit.x < 200 ? WT_AREAS[exit.to].width - 200 : 200;
            this.save();
            this.enter();
            Snd.select();
        }
    },
    nearNpc() {
        return this.area.npcs.find(n => Math.abs(n.x - this.s.x) < 82 && !(n.once && this.s.defeated[n.id]));
    },
    nearExit() {
        return this.area.exits.find(e => Math.abs(e.x - this.s.x) < 110);
    },
    talkTo(npc) {
        Snd.select();
        if (npc.need && !npc.need(this.s)) {
            this.dialog = { name: npc.name, lines: [npc.needText || 'Not yet.'], i: 0 };
            this.mode = 'dialog';
            return;
        }
        if (npc.kind === 'shop') {
            this.dialog = { name: npc.name, lines: (typeof npc.lines === 'function' ? npc.lines(this.s) : npc.lines).slice(), i: 0, thenShop: true };
            this.mode = 'dialog';
            return;
        }
        const beaten = this.s.defeated[npc.id];
        let lines;
        if (beaten && (npc.kind === 'fight' || npc.kind === 'master' || npc.kind === 'boss')) {
            lines = npc.kind === 'boss' ? ['The street is yours. I only keep the hum.'] : ['Again? Fine - but you already took what I had.'];
        } else {
            lines = (typeof npc.lines === 'function' ? npc.lines(this.s) : npc.lines).slice();
        }
        this.dialog = {
            name: npc.name, lines, i: 0,
            thenFight: !beaten && (npc.kind === 'fight' || npc.kind === 'master' || npc.kind === 'boss') ? npc : null,
            npc
        };
        this.mode = 'dialog';
        if (npc.after && npc.kind === 'talk') {
            if (npc.id === 'mika' && this.s.flags.metMika && this.s.flags.punksDown) this.s.flags.mikaTwice = true;
            npc.after(this.s);
            this.save();
        }
    },
    dialogUpdate(p, tap) {
        if (!BTNS.some(b => p.pressed(b)) && !p.pressed('start') && !tap) return;
        const d = this.dialog;
        d.i++;
        Snd.menu();
        if (d.i < d.lines.length) return;
        this.dialog = null;
        this.mode = 'walk';
        if (d.thenFight) { this.startFight(d.thenFight); return; }
        if (d.thenShop) { this.mode = 'shop'; this.shopI = 0; return; }
        if (this.endingPending) { this.endingPending = false; Game.go('wtEnd'); }
    },

    SHOP: [
        { name: '+20 MAX HP', cost: 100, apply: s => s.hpBonus += 20 },
        { name: '+3% DAMAGE', cost: 150, apply: s => s.atkBonus += 0.03 },
        { name: '+4% DEFENCE', cost: 150, apply: s => s.defBonus = (s.defBonus || 0) + 0.04 },
        { name: 'LEAVE', cost: 0, apply: null }
    ],
    SHOP_ROW: i => ({ x: 280, y: 300 + i * 56 - 26, w: W - 560, h: 42 }),
    SLOT_ROW: i => ({ x: 180, y: 300 + i * 54 - 28, w: W - 360, h: 44 }),
    CLOSE_ROW: { x: W / 2 - 140, y: 452, w: 280, h: 46 },

    shopUpdate(p, tap) {
        if (p.pressed2('down')) { this.shopI = (this.shopI + 1) % this.SHOP.length; Snd.menu(); }
        if (p.pressed2('up')) { this.shopI = (this.shopI + this.SHOP.length - 1) % this.SHOP.length; Snd.menu(); }
        if (tap) {
            const i = this.SHOP.findIndex((_, n) => inRect(tap, this.SHOP_ROW(n)));
            if (i < 0) return;
            this.shopI = i;
        } else if (!BTNS.some(b => p.pressed(b))) return;
        const it = this.SHOP[this.shopI];
        if (!it.apply) { this.mode = 'walk'; Snd.select(); return; }
        if (this.s.money < it.cost) { this.toastUp('NOT ENOUGH ZENNY'); Snd.whiff(); return; }
        this.s.money -= it.cost;
        it.apply(this.s);
        this.toastUp(it.name + ' BOUGHT');
        Snd.select();
        this.save();
    },
    cycleSlot(i, dir) {
        const slot = WT_SLOTS[i];
        const pool = this.pool();
        const taken = WT_SLOTS.filter(s => s !== slot).map(s => this.s.slots[s]);
        const cur = pool.findIndex(o => o.char === this.s.slots[slot].char && o.key === this.s.slots[slot].key);
        /* step over anything already sitting in one of the other slots */
        for (let n = 1; n <= pool.length; n++) {
            const cand = pool[(cur + dir * n + pool.length * n) % pool.length];
            if (taken.some(t => t.char === cand.char && t.key === cand.key)) continue;
            this.s.slots[slot] = cand;
            break;
        }
        Snd.menu(); this.save();
    },
    /* =================================================================
       PLAYER STATUS
       Laid out the way a modern World Tour profile is: the fighter stands
       on the left turning on the spot, and a tabbed panel on the right
       carries the numbers, the equipped moves and the masters.
       ================================================================= */
    TABS: ['STATUS', 'MOVES', 'MASTERS'],
    PANEL: { x: 452, y: 84, w: 800, h: 574 },
    TAB_RECT(i) { return { x: this.PANEL.x + 16 + i * 176, y: this.PANEL.y + 14, w: 168, h: 44 }; },
    STAT_ROW(i) { return { x: this.PANEL.x + 26, y: this.PANEL.y + 122 + i * 52, w: this.PANEL.w - 52, h: 44 }; },
    MOVE_ROW(i) { return { x: this.PANEL.x + 26, y: this.PANEL.y + 118 + i * 62, w: this.PANEL.w - 52, h: 54 }; },
    CLOSE_BTN: { x: 1032, y: 668, w: 220, h: 42 },

    statusUpdate(p, tap) {
        const tabs = this.TABS.length;
        if (this.statusTab === undefined) { this.statusTab = 0; this.statusI = 0; this.spin = 0; }
        this.spin = (this.spin || 0) + 1;
        const rows = this.statusTab === 1 ? 3 : 0;

        /* parry / impact act as the shoulder buttons and always change tab -
           on the moves tab left and right are busy swapping specials */
        if (p.pressed('impact')) { this.statusTab = (this.statusTab + 1) % tabs; this.statusI = 0; Snd.menu(); }
        if (p.pressed('parry')) { this.statusTab = (this.statusTab + tabs - 1) % tabs; this.statusI = 0; Snd.menu(); }
        if (this.statusTab !== 1) {
            if (p.pressed2('right')) { this.statusTab = (this.statusTab + 1) % tabs; this.statusI = 0; Snd.menu(); }
            if (p.pressed2('left')) { this.statusTab = (this.statusTab + tabs - 1) % tabs; this.statusI = 0; Snd.menu(); }
        } else {
            /* on the moves tab left/right swaps the highlighted slot */
            if (p.pressed2('right')) this.cycleSlot(this.statusI, 1);
            if (p.pressed2('left')) this.cycleSlot(this.statusI, -1);
        }
        if (rows) {
            if (p.pressed2('down')) { this.statusI = (this.statusI + 1) % rows; Snd.menu(); }
            if (p.pressed2('up')) { this.statusI = (this.statusI + rows - 1) % rows; Snd.menu(); }
        } else {
            if (p.pressed2('down') || p.pressed2('up')) {
                this.statusTab = (this.statusTab + (p.pressed2('down') ? 1 : tabs - 1)) % tabs;
                this.statusI = 0; Snd.menu();
            }
        }

        if (tap) {
            for (let i = 0; i < tabs; i++) {
                if (inRect(tap, this.TAB_RECT(i))) { this.statusTab = i; this.statusI = 0; Snd.menu(); return; }
            }
            if (this.statusTab === 1) {
                for (let i = 0; i < 3; i++) {
                    if (!inRect(tap, this.MOVE_ROW(i))) continue;
                    if (this.statusI === i) this.cycleSlot(i, 1);
                    else { this.statusI = i; Snd.menu(); }
                    return;
                }
            }
            if (inRect(tap, this.CLOSE_BTN)) { this.mode = 'walk'; Snd.select(); }
            return;
        }
        if (p.pressed('start')) { this.mode = 'walk'; Snd.select(); }
    },


    /* ------------------------------ draw ------------------------------- */
    npcFighter(npc) {
        if (!this.npcCache[npc.id]) {
            const f = new Fighter(npc.char, 1, PADS.cpu1, 0);
            f.state = 'idle'; f.anim = 'idle'; f.animT = (npc.x | 0) % 30;
            this.npcCache[npc.id] = f;
        }
        return this.npcCache[npc.id];
    },
    draw() {
        if (Game.use3d()) return this.draw3d();
        const s = this.s;
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.translate(W / 2, H * 0.58);
        ctx.scale(0.92, 0.92);
        ctx.translate(-this.camX, -(H * 0.58));
        Stage.right = this.area.width;
        Stage.draw(this.area.stage, this.walkT);
        Stage.right = STAGE_W;

        /* exits */
        for (const e of this.area.exits) {
            const locked = e.need && !e.need(this.s);
            ctx.save();
            ctx.globalAlpha = 0.75 + Math.sin(this.walkT * 0.06) * 0.2;
            ctx.fillStyle = locked ? '#ff4d6d' : '#3dffb0';
            ctx.font = px(13); ctx.textAlign = 'center';
            ctx.fillText(locked ? 'LOCKED' : e.label, e.x, GROUND_Y - 250);
            ctx.fillText(e.x < 200 ? '<<' : '>>', e.x, GROUND_Y - 210);
            ctx.globalAlpha = 0.18;
            ctx.fillRect(e.x - 60, GROUND_Y - 200, 120, 200);
            ctx.restore();
        }

        /* NPCs */
        for (const n of this.area.npcs) {
            const f = this.npcFighter(n);
            f.x = n.x; f.y = GROUND_Y;
            f.facing = this.s.x >= n.x ? 1 : -1;
            f.auraT = this.walkT;
            f.updatePose();
            drawFighter(f, 1);
            const beaten = this.s.defeated[n.id];
            const mark = beaten ? '' : (n.kind === 'talk' || n.kind === 'shop' ? '!' : '*');
            const col = n.kind === 'boss' ? '#ff2e63' : (n.kind === 'master' ? '#ffd400' : '#00f3ff');
            ctx.save();
            ctx.textAlign = 'center';
            ctx.font = px(10); ctx.fillStyle = beaten ? '#6b6280' : col;
            ctx.fillText(n.name, n.x, GROUND_Y - 205);
            if (mark) {
                ctx.font = px(22); ctx.fillStyle = col;
                ctx.shadowBlur = 14; ctx.shadowColor = col;
                ctx.fillText(mark, n.x, GROUND_Y - 232 + Math.sin(this.walkT * 0.12) * 5);
            }
            ctx.restore();
        }

        /* the player */
        drawFighter(this.player, 1);
        ctx.restore();

        if (this.mode === 'walk' || this.mode === 'dialog') this.hud();
        if (this.mode === 'dialog') this.drawDialog();
        if (this.mode === 'status') this.drawStatus();
        if (this.mode === 'shop') this.drawShop();
    },
    draw3d() {
        R3D.originX = this.area.width / 2;
        if (R3D.stageName !== 'wt:' + this.s.area) {
            STAGE3D.build(this.area.stage, this.area.width);
            R3D.stageName = 'wt:' + this.s.area;
        }
        const active = [];
        for (const n of this.area.npcs) {
            const f = this.npcFighter(n);
            f.x = n.x; f.y = GROUND_Y;
            f.facing = this.s.x >= n.x ? 1 : -1;
            f.auraT = this.walkT;
            f.updatePose();
            active.push(R3D.syncFighter(f, 'npc:' + n.id).id);
        }
        active.push(R3D.syncFighter(this.player, 'wtplayer').id);
        R3D.hideUnused(active);
        R3D.syncProjectiles();
        R3D.syncCamera(this.s.x, 320, 2.1);
        R3D.render();

        /* name plates and markers, projected onto the 3D street */
        const showLabels = this.mode === 'walk' || this.mode === 'dialog';
        for (const n of (showLabels ? this.area.npcs : [])) {
            const p = R3D.project(n.x, GROUND_Y - 210);
            if (p.x < -80 || p.x > W + 80) continue;
            const beaten = this.s.defeated[n.id];
            const col = n.kind === 'boss' ? '#ff2e63' : (n.kind === 'master' ? '#ffd400' : '#00f3ff');
            shadowText(n.name, p.x, p.y, 10, beaten ? '#6b6280' : col);
            if (!beaten) {
                const mark = (n.kind === 'talk' || n.kind === 'shop') ? '!' : '*';
                shadowText(mark, p.x, p.y - 26 + Math.sin(this.walkT * 0.12) * 5, 20, col, 'center', 12);
            }
        }
        for (const e of (showLabels ? this.area.exits : [])) {
            const locked = e.need && !e.need(this.s);
            const p = R3D.project(e.x, GROUND_Y - 250);
            if (p.x < -120 || p.x > W + 120) continue;
            shadowText(locked ? 'LOCKED' : e.label, p.x, p.y, 12, locked ? '#ff4d6d' : '#3dffb0', 'center', 10);
            shadowText(e.x < 200 ? '<<' : '>>', p.x, p.y + 30, 12, locked ? '#ff4d6d' : '#3dffb0');
        }
        FX.draw3d();
        if (this.mode === 'walk' || this.mode === 'dialog') this.hud();
        if (this.mode === 'dialog') this.drawDialog();
        if (this.mode === 'status') this.drawStatus();
        if (this.mode === 'shop') this.drawShop();
    },
    hud() {
        const s = this.s;
        ctx.save();
        ctx.fillStyle = 'rgba(6,3,14,.8)';
        ctx.fillRect(20, 20, 430, 92);
        ctx.strokeStyle = '#ff2e63'; ctx.lineWidth = 3; ctx.strokeRect(20, 20, 430, 92);
        ctx.restore();
        shadowText('LV ' + s.level + '   ' + this.area.name, 38, 48, 13, '#fff', 'left');
        /* xp bar */
        const p = clamp(s.xp / this.xpNeeded(), 0, 1);
        ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(38, 60, 250, 10);
        ctx.fillStyle = '#3dffb0'; ctx.fillRect(38, 60, 250 * p, 10);
        shadowText(s.money + ' Z', 432, 70, 12, '#ffd400', 'right');
        shadowText('HP ' + this.maxHpOf() + '   ATK x' + this.dmgMulOf().toFixed(2), 38, 96, 10, '#9d8fb5', 'left');

        /* objective */
        ctx.save();
        ctx.fillStyle = 'rgba(6,3,14,.8)';
        ctx.fillRect(W - 560, 20, 540, 52);
        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2; ctx.strokeRect(W - 560, 20, 540, 52);
        ctx.restore();
        shadowText('OBJECTIVE', W - 540, 42, 9, '#00f3ff', 'left');
        shadowText(this.questText(), W - 540, 62, 10, '#fff', 'left');

        if (this.mode === 'walk' && this.prompt)
            shadowText('[ ANY BUTTON ]  ' + this.prompt, W / 2, H - 120, 13, '#ffd400', 'center', 12);
        if (this.mode === 'walk')
            shadowText('MOVE: LEFT / RIGHT      START: STATUS AND MOVES', W / 2, H - 40, 10, '#8a7fa8');
        if (this.toastT > 0) {
            ctx.save();
            ctx.globalAlpha = clamp(this.toastT / 40, 0, 1);
            shadowText(this.toast, W / 2, 200, 26, '#ffd400', 'center', 18);
            ctx.restore();
        }
    },
    drawDialog() {
        const d = this.dialog;
        ctx.save();
        ctx.fillStyle = 'rgba(4,2,10,.92)';
        ctx.fillRect(60, H - 210, W - 120, 170);
        ctx.strokeStyle = '#ff2e63'; ctx.lineWidth = 4;
        ctx.strokeRect(60, H - 210, W - 120, 170);
        ctx.restore();
        shadowText(d.name, 88, H - 176, 15, '#ff2e63', 'left');
        const line = d.lines[Math.min(d.i, d.lines.length - 1)] || '';
        wrapText(line, 88, H - 132, W - 200, 26, 12, '#fff');
        if (d.reward && d.i >= d.lines.length - 1) {
            const r = d.reward;
            shadowText('+' + r.xp + ' XP   +' + r.money + ' Z' + (r.teach ? '   NEW MOVE!' : ''), W - 100, H - 60, 11, '#3dffb0', 'right');
        }
        if (Math.floor(this.walkT / 16) % 2 === 0)
            shadowText('>', W - 100, H - 168, 14, '#ffd400', 'right');
    },
    statBars() {
        const s = this.s, base = CHAR_BY_ID[s.style];
        return [
            ['HEALTH', this.maxHpOf(), 1600, this.maxHpOf() + '', '#3ddc84'],
            ['ATTACK', this.dmgMulOf(), 2, 'x' + this.dmgMulOf().toFixed(2), '#ff2e63'],
            ['DEFENCE', 1 + (s.defBonus || 0), 1.6, '+' + Math.round((s.defBonus || 0) * 100) + '%', '#00f3ff'],
            ['SPEED', base.stats.walkF, 4.2, base.stats.walkF.toFixed(1), '#ffd400'],
            ['WEIGHT', base.stats.weight, 1.5, base.stats.weight.toFixed(2), '#b388ff'],
            ['STUN', base.stats.stun, 1300, base.stats.stun + '', '#ff8f1f']
        ];
    },

    drawStatus() {
        const s = this.s, P = this.PANEL;
        if (this.statusTab === undefined) { this.statusTab = 0; this.spin = 0; }

        /* backdrop: dim whatever is behind, keep the fighter lit */
        ctx.save();
        ctx.fillStyle = 'rgba(3,2,8,.72)';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();

        /* --- the fighter, turning on the spot --- */
        if (Game.use3d()) {
            R3D.originX = this.area.width / 2;
            this.player.setAnim(this.spin % 260 < 130 ? 'idle' : 'win');
            this.player.auraT = this.walkT;
            this.player.updatePose();
            const id = R3D.syncFighter(this.player, 'wtplayer').id;
            R3D.hideUnused([id]);
            R3D.portraitCamera(this.player.x, this.spin * 0.011);
            R3D.render();
        } else {
            const f = this.player;
            const sx = f.x, sy = f.y, sf = f.facing;
            f.x = 236; f.y = 590; f.facing = 1;
            f.setAnim(this.spin % 260 < 130 ? 'idle' : 'win');
            f.updatePose();
            ctx.save();
            ctx.translate(236, 590); ctx.scale(1.7, 1.7); ctx.translate(-236, -590);
            drawFighter(f, 1);
            ctx.restore();
            f.x = sx; f.y = sy; f.facing = sf;
        }

        /* name plate under the fighter */
        shadowText(CHAR_BY_ID[s.style].name + ' STYLE', 236, 626, 13, '#fff', 'center', 10);
        shadowText('"' + CHAR_BY_ID[s.style].title + '"', 236, 652, 9, '#9d8fb5');

        /* --- panel --- */
        ctx.save();
        const g = ctx.createLinearGradient(P.x, P.y, P.x, P.y + P.h);
        g.addColorStop(0, 'rgba(12,6,26,.96)');
        g.addColorStop(1, 'rgba(5,3,14,.96)');
        ctx.fillStyle = g;
        ctx.fillRect(P.x, P.y, P.w, P.h);
        ctx.strokeStyle = '#ff2e63'; ctx.lineWidth = 3;
        ctx.strokeRect(P.x, P.y, P.w, P.h);
        ctx.fillStyle = '#ff2e63';
        ctx.fillRect(P.x, P.y, P.w, 4);
        ctx.restore();

        /* tabs */
        this.TABS.forEach((t, i) => {
            const r = this.TAB_RECT(i);
            const on = this.statusTab === i;
            ctx.save();
            ctx.fillStyle = on ? 'rgba(255,46,99,.22)' : 'rgba(255,255,255,.05)';
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = on ? '#ff2e63' : '#ffffff22';
            ctx.lineWidth = 2;
            ctx.strokeRect(r.x, r.y, r.w, r.h);
            ctx.restore();
            shadowText(t, r.x + r.w / 2, r.y + 28, 12, on ? '#fff' : '#8a7fa8', 'center', on ? 10 : 0);
        });

        /* header line: level + experience */
        const hx = P.x + 26, hy = P.y + 92;
        shadowText('LV ' + s.level, hx, hy, 20, '#ffd400', 'left', 12);
        const xw = 300, xp = clamp(s.xp / this.xpNeeded(), 0, 1);
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fillRect(hx + 120, hy - 14, xw, 14);
        ctx.fillStyle = '#3dffb0'; ctx.fillRect(hx + 120, hy - 14, xw * xp, 14);
        ctx.strokeStyle = '#ffffff33'; ctx.lineWidth = 1; ctx.strokeRect(hx + 120, hy - 14, xw, 14);
        ctx.restore();
        shadowText(s.xp + ' / ' + this.xpNeeded() + ' XP', hx + 120 + xw + 12, hy, 9, '#9d8fb5', 'left');
        shadowText(s.money + ' Z', P.x + P.w - 26, hy, 14, '#ffd400', 'right');

        if (this.statusTab === 0) this.tabStatus();
        else if (this.statusTab === 1) this.tabMoves();
        else this.tabMasters();

        /* close button */
        const c = this.CLOSE_BTN;
        ctx.save();
        ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(c.x, c.y, c.w, c.h);
        ctx.strokeStyle = '#ffffff44'; ctx.lineWidth = 2; ctx.strokeRect(c.x, c.y, c.w, c.h);
        ctx.restore();
        shadowText('START / TAP TO CLOSE', c.x + c.w / 2, c.y + 27, 9, '#cbbfe0');
        shadowText('Q / E  OR TAP A TAB TO SWITCH', P.x + 26, c.y + 27, 9, '#8a7fa8', 'left');
    },

    tabStatus() {
        const P = this.PANEL;
        this.statBars().forEach((b, i) => {
            const r = this.STAT_ROW(i);
            shadowText(b[0], r.x, r.y + 26, 11, '#cbbfe0', 'left');
            const bx = r.x + 150, bw = r.w - 260;
            const p = clamp(b[1] / b[2], 0, 1);
            ctx.save();
            ctx.fillStyle = 'rgba(255,255,255,.08)';
            ctx.fillRect(bx, r.y + 12, bw, 18);
            const grad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
            grad.addColorStop(0, b[4]);
            grad.addColorStop(1, '#ffffff');
            ctx.fillStyle = grad;
            ctx.fillRect(bx, r.y + 12, bw * p, 18);
            ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1;
            ctx.strokeRect(bx, r.y + 12, bw, 18);
            for (let n = 1; n < 4; n++) {
                ctx.fillStyle = '#00000055';
                ctx.fillRect(bx + bw / 4 * n, r.y + 12, 1, 18);
            }
            ctx.restore();
            shadowText(b[3], r.x + r.w, r.y + 26, 11, '#fff', 'right');
        });
        const s = this.s;
        const beaten = Object.keys(s.defeated).length;
        shadowText('RIVALS BEATEN  ' + beaten + '     MOVES LEARNED  ' + s.learned.length +
            '     DISTRICT  ' + this.area.name, this.PANEL.x + 26, this.PANEL.y + 470, 9, '#8a7fa8', 'left');
    },

    tabMoves() {
        const P = this.PANEL;
        shadowText('EQUIPPED SPECIALS', P.x + 26, P.y + 112, 10, '#ffd400', 'left');
        WT_SLOTS.forEach((slot, i) => {
            const r = this.MOVE_ROW(i);
            const on = this.statusI === i;
            ctx.save();
            ctx.fillStyle = on ? 'rgba(255,46,99,.16)' : 'rgba(255,255,255,.04)';
            ctx.fillRect(r.x, r.y, r.w, r.h);
            ctx.strokeStyle = on ? '#ff2e63' : '#ffffff1a';
            ctx.lineWidth = 2;
            ctx.strokeRect(r.x, r.y, r.w, r.h);
            ctx.restore();
            const ref = this.s.slots[slot], mv = this.moveOf(ref);
            const input = Game.controls === 'modern'
                ? (slot === 'neutral' ? 'SPECIAL' : slot === 'down' ? 'DOWN + SPECIAL' : 'FWD + SPECIAL')
                : (MOTION_TEXT[SLOT_MOTION[slot]] + ' + ' + (mv ? mv.btn : 'P'));
            shadowText(input, r.x + 14, r.y + 22, 9, on ? '#00f3ff' : '#7f74a0', 'left');
            shadowText(mv ? mv.name : '-', r.x + 14, r.y + 44, 13, on ? '#fff' : '#b9aed2', 'left');
            const from = ref && CHAR_BY_ID[ref.char] ? CHAR_BY_ID[ref.char].name : '';
            shadowText('FROM ' + from, r.x + r.w - 14, r.y + 44, 9, '#8a7fa8', 'right');
            if (on) shadowText('< LEFT / RIGHT >', r.x + r.w - 14, r.y + 20, 8, '#ffd400', 'right');
        });
        const pool = this.pool();
        shadowText('YOUR MOVE POOL  (' + pool.length + ')', P.x + 26, P.y + 330, 10, '#ffd400', 'left');
        pool.forEach((o, i) => {
            const mv = this.moveOf(o);
            if (!mv) return;
            const col = i % 2, row = Math.floor(i / 2);
            const x = P.x + 26 + col * 380, y = P.y + 362 + row * 30;
            const equipped = WT_SLOTS.some(sl => this.s.slots[sl].char === o.char && this.s.slots[sl].key === o.key);
            shadowText((equipped ? '* ' : '  ') + mv.name, x, y, 10, equipped ? '#3dffb0' : '#b9aed2', 'left');
            shadowText(CHAR_BY_ID[o.char].name, x + 350, y, 8, '#8a7fa8', 'right');
        });
    },

    tabMasters() {
        const P = this.PANEL;
        shadowText('MASTERS AND WHAT THEY TEACH', P.x + 26, P.y + 112, 10, '#ffd400', 'left');
        const masters = [
            { id: 'ryko', ch: 'ryko', where: 'DOWNTOWN', key: 'bolt' },
            { id: 'hako', ch: 'hako', where: 'DOJO DISTRICT', key: 'crane' },
            { id: 'brutus', ch: 'brutus', where: 'SUBWAY LINE', key: 'charge' },
            { id: 'kana', ch: 'kana', where: 'SUBWAY LINE', key: 'claw' },
            { id: 'nova', ch: 'nova', where: 'ROOFTOPS', key: 'orb' },
            { id: 'volt', ch: 'volt', where: 'ROOFTOPS', key: null }
        ];
        masters.forEach((m, i) => {
            const y = P.y + 146 + i * 62;
            const c = CHAR_BY_ID[m.ch];
            const done = !!this.s.defeated[m.id];
            ctx.save();
            ctx.fillStyle = done ? 'rgba(61,255,176,.08)' : 'rgba(255,255,255,.04)';
            ctx.fillRect(P.x + 26, y - 26, P.w - 52, 50);
            ctx.strokeStyle = done ? '#3dffb055' : '#ffffff14';
            ctx.lineWidth = 2;
            ctx.strokeRect(P.x + 26, y - 26, P.w - 52, 50);
            /* a colour chip standing in for the master's portrait */
            ctx.fillStyle = c.style.gi;
            ctx.fillRect(P.x + 34, y - 20, 38, 38);
            ctx.fillStyle = c.style.trim;
            ctx.fillRect(P.x + 34, y + 12, 38, 6);
            ctx.restore();
            shadowText(c.name, P.x + 84, y - 2, 12, done ? '#fff' : '#9d8fb5', 'left');
            shadowText(m.where, P.x + 84, y + 18, 8, '#8a7fa8', 'left');
            const taught = m.key && c.specials[m.key] ? c.specials[m.key].name : 'THE STORM ITSELF';
            shadowText(done ? 'LEARNED: ' + taught : (m.key ? 'TEACHES: ' + taught : 'FINAL RIVAL'),
                P.x + P.w - 40, y - 2, 9, done ? '#3dffb0' : '#7f74a0', 'right');
            shadowText(done ? 'DEFEATED' : 'NOT BEATEN', P.x + P.w - 40, y + 18, 8,
                done ? '#3dffb0' : '#ff6b81', 'right');
        });
    },
    drawShop() {
        ctx.save();
        ctx.fillStyle = 'rgba(4,2,10,.93)'; ctx.fillRect(240, 160, W - 480, 340);
        ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 4; ctx.strokeRect(240, 160, W - 480, 340);
        ctx.restore();
        shadowText('COACH DEE', W / 2, 210, 20, '#ffd400', 'center', 12);
        shadowText('YOU HAVE ' + this.s.money + ' Z', W / 2, 244, 11, '#fff');
        this.SHOP.forEach((it, i) => {
            const y = 300 + i * 56;
            const on = this.shopI === i;
            if (on) {
                ctx.save();
                ctx.fillStyle = 'rgba(255,212,0,.14)'; ctx.fillRect(280, y - 26, W - 560, 42);
                ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2; ctx.strokeRect(280, y - 26, W - 560, 42);
                ctx.restore();
            }
            shadowText(it.name, 306, y, 12, on ? '#fff' : '#9d8fb5', 'left');
            if (it.cost) shadowText(it.cost + ' Z', W - 306, y, 12, on ? '#ffd400' : '#9d8fb5', 'right');
        });
        if (this.toastT > 0) shadowText(this.toast, W / 2, 470, 11, '#3dffb0');
    }
};

function wrapText(str, x, y, maxW, lh, size, col) {
    ctx.save();
    ctx.font = px(size);
    const words = String(str).split(' ');
    let line = '', ly = y;
    for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) {
            shadowText(line, x, ly, size, col, 'left');
            line = w; ly += lh;
        } else line = test;
    }
    if (line) shadowText(line, x, ly, size, col, 'left');
    ctx.restore();
}
/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function tick() {
    PADS.p1.readKeys(); PADS.p1.commit();
    PADS.p2.readKeys(); PADS.p2.commit();
    Game.update();
    PADS.p1.endFrame(); PADS.p2.endFrame();
    PADS.cpu1.endFrame(); PADS.cpu2.endFrame();
    if (TOUCH.start) TOUCH.start = false;
    Snd.pumpMusic();
}

let acc = 0, last = performance.now();
function loop(now) {
    requestAnimationFrame(loop);
    watchViewport();
    let dt = now - last; last = now;
    if (dt > 240) dt = 240;
    acc += dt;
    let guard = 0;
    while (acc >= STEP && guard++ < 6) { tick(); acc -= STEP; }
    Game.draw();
}

fit();
Game.boot();
requestAnimationFrame(loop);
    </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Darky Play Arcade - Free Quiz Games for Kids</title>
<meta name="description" content="Darky Play Arcade: free quiz games in your browser. Answer questions, open chests and beat your rivals. No download, works on phone and PC.">
<link rel="canonical" href="https://darkyplay.com/arcade/">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="../shared/analytics.js?v=2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px) 0 0 / 100% 4px,
      radial-gradient(ellipse at top, #2a1f4d 0%, #111 65%);
    color: #fff;
    font-family: 'Press Start 2P', monospace;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px;
    text-align: center;
  }
  .top { width: 100%; max-width: 900px; display: flex; justify-content: space-between; align-items: center; font-size: 10px; }
  .top a { color: #a9a6c4; text-decoration: none; }
  .top a:hover { color: #fff; }
  .top .brand { color: #a9a6c4; letter-spacing: 2px; }
  h1 {
    margin: 60px 0 14px;
    font-size: clamp(36px, 10vw, 80px);
    letter-spacing: 6px;
    color: #ffc83d;
    text-shadow: 0 0 24px rgba(255,200,61,.55), 5px 5px 0 #7a4b00;
  }
  .sub { color: #a9a6c4; font-size: 11px; line-height: 1.8; margin-bottom: 50px; }
  .blink { animation: blink 1.1s steps(1) infinite; color: #ffc83d; }
  @keyframes blink { 50% { opacity: 0; } }

  .grid { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; width: 100%; max-width: 900px; }
  .card {
    background: #222; border: 4px solid #ffc83d; border-radius: 10px;
    padding: 30px 20px; width: 100%; max-width: 230px;
    color: #ffc83d; text-decoration: none;
    box-shadow: 0 0 12px #ffc83d;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    transition: all .3s;
  }
  a.card:hover { background: #ffc83d; color: #000; box-shadow: 0 0 30px #ffc83d; transform: scale(1.08); }
  .card .icon { font-size: 3rem; }
  .card .name { font-size: 13px; line-height: 1.5; }
  .card .desc { font-family: system-ui, sans-serif; font-weight: 700; font-size: 13px; color: #cfcbe6; line-height: 1.4; }
  a.card:hover .desc { color: #3b2400; }
  .card.soon { border-color: #444; color: #666; box-shadow: none; }
  .card.soon .desc { color: #666; }

  footer { margin-top: auto; padding-top: 60px; font-size: 9px; color: #666; }
</style>
</head>
<body>
  <div class="top">
    <a href="https://darkyplay.com/">&larr; DARKYPLAY</a>
    <span class="brand">ARCADE</span>
  </div>

  <h1>ARCADE</h1>
  <p class="sub">Quiz games. Answer fast, win big<span class="blink">_</span></p>

  <div class="grid">
    <a href="gold-quiz/" class="card">
      <div class="icon">&#129689;</div>
      <div class="name">GOLD QUIZ</div>
      <div class="desc">Answer questions, open chests, steal gold from rivals.</div>
    </a>
    <div class="card soon">
      <div class="icon">&#10067;</div>
      <div class="name">COMING SOON</div>
      <div class="desc">More quiz games on the way.</div>
    </div>
  </div>

  <footer>&copy; DARKY PLAY</footer>
</body>
</html>

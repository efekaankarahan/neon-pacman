            transition: background 0.15s, border-color 0.15s, transform 0.1s;

        .cell:disabled {

        }

        .cell.free:hover {
            background: rgba(255, 255, 255, 0.08);

            transform: scale(0.96);

        .cell.x {

        .cell.o {

        @keyframes pop {
            0% { transform: scale(1); }

        }

        .board.shake {
            animation: shake 0.35s ease;

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }

        /* ---------- Status ---------- */
        .status {
            min-height: 26px;

        }

        .status .who-x { color: #00e0ff; }

        .btns {

        /* ---------- Overlay ---------- */

        .panel {

<body>
    <div class="wrap">
        <h1>PIC PAC POE</h1>
        <div class="tagline">You vs the machine</div>

        <div class="stats">
            <div class="stat streak">
                <div class="k">Streak</div>
                <div class="v" id="streak">0</div>
            </div>
            <div class="stat">
                <div class="k">Best</div>
                <div class="v" id="best">0</div>
            </div>
            <div class="stat level">
                <div class="k">Poe is</div>
                <div class="v" id="level">Rookie</div>
            </div>
        </div>

        <div class="board" id="board"></div>

        <div class="status" id="status">Your move.</div>

        <div class="btns">
            <button class="action primary" id="againBtn" style="display:none;">Next Round</button>
            <button class="action secondary" id="homeBtn">Main Menu</button>
        </div>
    </div>

    <div class="overlay" id="overScreen">
        <div class="panel">
            <div class="emoji" id="overIcon">&#129302;</div>
            <div class="rank" id="rankLabel">Rookie</div>
            <h2>Poe got you</h2>
            <div class="new-best" id="newBest" style="display:none;">&#11088; NEW RECORD!</div>
            <p id="overText">Your streak ended at 0.</p>
            <div class="btns">
                <button class="action primary" id="restartBtn">Play Again</button>
                <button class="action secondary" id="overHomeBtn">Main Menu</button>
            </div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------------
        // Pic Pac Poe - tic tac toe against an opponent that sharpens each
        // time you beat it. The run ends the first time you lose, so the
        // score is simply how many rounds you took off it in a row.
        //
        // "Poe" plays perfect minimax, but at low streaks it throws away a
        // share of its moves on purpose - that share shrinks as you win, so
        // a beginner gets a fair first game and a good player gets a wall.
        // ---------------------------------------------------------------
        const HUMAN = 'X';
        const AI = 'O';

        const LINES = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8],
            [0, 3, 6], [1, 4, 7], [2, 5, 8],
            [0, 4, 8], [2, 4, 6]
        ];

        const LEVELS = [
            { at: 0, name: 'Rookie', mistake: 0.70 },
            { at: 1, name: 'Learning', mistake: 0.55 },
            { at: 2, name: 'Awake', mistake: 0.40 },
            { at: 3, name: 'Sharp', mistake: 0.26 },
            { at: 4, name: 'Cold', mistake: 0.16 },
            { at: 5, name: 'Ruthless', mistake: 0.08 }
        ];

        let board, turn, streak, best, busy, roundOver, winLine;

        try { best = parseInt(localStorage.getItem('picPacPoeBest')) || 0; } catch (e) { best = 0; }

        // ---------------------------------------------------------------
        // Sound
        // ---------------------------------------------------------------
        let audioCtx = null;
        let sfxOn = true;
        try { sfxOn = localStorage.getItem('picPacPoeMuted') !== '1'; } catch (e) { }

        function blip(freq, dur, type, gain, slideTo) {
            if (!sfxOn) return;
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const t = audioCtx.currentTime;
                const o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = type;
                o.frequency.setValueAtTime(freq, t);
                if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
                g.gain.setValueAtTime(gain, t);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                o.connect(g).connect(audioCtx.destination);
                o.start(t);
                o.stop(t + dur);
            } catch (e) { }
        }

        const sndYou = () => blip(560, 0.08, 'square', 0.05, 760);
        const sndThem = () => blip(300, 0.09, 'triangle', 0.05, 220);
        const sndWin = () => blip(700, 0.2, 'triangle', 0.08, 1500);
        const sndLose = () => blip(260, 0.35, 'sawtooth', 0.08, 60);
        const sndDraw = () => blip(400, 0.14, 'square', 0.05, 380);

        // ---------------------------------------------------------------
        // Rules
        // ---------------------------------------------------------------
        function winnerOf(b) {
            for (const L of LINES) {
                if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]]) {
                    return { who: b[L[0]], line: L };
                }
            }
            return b.indexOf('') === -1 ? { who: 'draw', line: null } : null;
        }

        const emptyCells = (b) => b.reduce((a, v, i) => (v === '' ? (a.push(i), a) : a), []);

        // Classic minimax. The board is small enough that a plain search is
        // instant - no pruning or memo needed.
        function minimax(b, forAI, depth) {
            const w = winnerOf(b);
            if (w) {
                if (w.who === AI) return { score: 10 - depth };
                if (w.who === HUMAN) return { score: depth - 10 };
                return { score: 0 };
            }

            let bestScore = forAI ? -Infinity : Infinity;
            let bestMove = -1;

            for (const i of emptyCells(b)) {
                b[i] = forAI ? AI : HUMAN;
                const s = minimax(b, !forAI, depth + 1).score;
                b[i] = '';
                if (forAI ? s > bestScore : s < bestScore) {
                    bestScore = s;
                    bestMove = i;
                }
            }
            return { score: bestScore, move: bestMove };
        }

        function levelFor(s) {
            let l = LEVELS[0];
            for (const L of LEVELS) if (s >= L.at) l = L;
            return l;
        }

        function aiMove() {
            const free = emptyCells(board);
            if (!free.length) return -1;
            const lvl = levelFor(streak);
            // Throwing away a move is what makes the early rounds winnable.
            if (Math.random() < lvl.mistake) {
                return free[Math.floor(Math.random() * free.length)];
            }
            return minimax(board.slice(), true, 0).move;
        }

        // ---------------------------------------------------------------
        // Rendering
        // ---------------------------------------------------------------
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');
        const streakEl = document.getElementById('streak');
        const bestEl = document.getElementById('best');
        const levelEl = document.getElementById('level');
        const againBtn = document.getElementById('againBtn');
        const overScreen = document.getElementById('overScreen');
        const overText = document.getElementById('overText');
        const overIcon = document.getElementById('overIcon');
        const rankLabel = document.getElementById('rankLabel');
        const newBestEl = document.getElementById('newBest');

        const cells = [];
        for (let i = 0; i < 9; i++) {
            const b = document.createElement('button');
            b.className = 'cell free';
            b.type = 'button';
            b.setAttribute('aria-label', 'Square ' + (i + 1));
            b.addEventListener('click', () => play(i));
            boardEl.appendChild(b);
            cells.push(b);
        }

        function paint() {
            for (let i = 0; i < 9; i++) {
                const v = board[i];
                cells[i].textContent = v === 'X' ? '✕' : (v === 'O' ? '◯' : '');
                // paint() rewrites className wholesale, so the winning line has
                // to be re-applied here or a later repaint erases the highlight
                const won = winLine && winLine.indexOf(i) !== -1;
                cells[i].className = 'cell'
                    + (v === 'X' ? ' x' : v === 'O' ? ' o' : ' free')
                    + (won ? ' win' : '');
                cells[i].disabled = !!v || busy || roundOver;
            }
            streakEl.textContent = streak;
            bestEl.textContent = best;
            levelEl.textContent = levelFor(streak).name;
        }

        function say(html) { statusEl.innerHTML = html; }

        // ---------------------------------------------------------------
        // Flow
        // ---------------------------------------------------------------
        function newRound() {
            board = ['', '', '', '', '', '', '', '', ''];
            winLine = null;
            roundOver = false;
            busy = false;
            againBtn.style.display = 'none';
            overScreen.classList.remove('active');

            // Alternate who opens, so a long streak cannot lean on always
            // having the first move.
            const aiOpens = streak % 2 === 1;
            paint();

            if (aiOpens) {
                say('<span class="who-o">Poe</span> opens this round.');
                busy = true;
                paint();
                setTimeout(() => {
                    const m = aiMove();
                    if (m >= 0) { board[m] = AI; sndThem(); }
                    busy = false;
                    turn = HUMAN;
                    paint();
                    say('Your move.');
                }, 500);
            } else {
                turn = HUMAN;
                say('Your move. You open.');
            }
        }

        function play(i) {
            if (busy || roundOver || board[i] || turn !== HUMAN) return;
            board[i] = HUMAN;
            sndYou();
            paint();
            if (finish()) return;

            busy = true;
            turn = AI;
            paint();
            say('<span class="who-o">Poe</span> is thinking…');

            setTimeout(() => {
                const m = aiMove();
                if (m >= 0) { board[m] = AI; sndThem(); }
                busy = false;
                turn = HUMAN;
                paint();
                if (!finish()) say('Your move.');
            }, 420);
        }

        // Returns true when the round has ended.
        function finish() {
            const w = winnerOf(board);
            if (!w) return false;

            roundOver = true;
            winLine = w.line;
            paint();

            if (w.who === HUMAN) {
                streak++;
                if (streak > best) { best = streak; saveBest(); }
                sndWin();
                say('You take it. Streak <b>' + streak + '</b> — Poe sharpens up.');
                againBtn.textContent = 'Next Round';
                againBtn.style.display = 'block';
            } else if (w.who === 'draw') {
                sndDraw();
                say('Draw. Streak holds at <b>' + streak + '</b>.');
                againBtn.textContent = 'Go Again';
                againBtn.style.display = 'block';
            } else {
                sndLose();
                boardEl.classList.add('shake');
                setTimeout(() => boardEl.classList.remove('shake'), 400);
                gameOver();
            }
            paint();
            return true;
        }

        function saveBest() {
            try { localStorage.setItem('picPacPoeBest', String(best)); } catch (e) { }
        }

        function gameOver() {
            const isNew = streak > 0 && streak >= best;
            overText.textContent = streak === 0
                ? 'Poe took the first one. Try again.'
                : 'Your streak ended at ' + streak + '.';
            newBestEl.style.display = (isNew && streak > 0) ? 'block' : 'none';

            let icon = '🤖', label = 'Rookie';
            if (streak >= 12) { icon = '👑'; label = 'Machine breaker'; }
            else if (streak >= 8) { icon = '🧠'; label = 'Grandmaster'; }
            else if (streak >= 5) { icon = '🔥'; label = 'Sharp'; }
            else if (streak >= 2) { icon = '🙂'; label = 'Warming up'; }
            overIcon.textContent = icon;
            rankLabel.textContent = label;

            setTimeout(() => overScreen.classList.add('active'), 700);
            if (window.DarkyScores) DarkyScores.submit('pic-pac-poe', streak);
        }

        function restart() {
            streak = 0;
            newRound();
        }

        againBtn.addEventListener('click', newRound);
        document.getElementById('restartBtn').addEventListener('click', restart);
        document.getElementById('homeBtn').addEventListener('click', goHome);
        document.getElementById('overHomeBtn').addEventListener('click', goHome);

        function goHome() { window.location.href = '../index.html'; }

        streak = 0;
        newRound();
    </script>
